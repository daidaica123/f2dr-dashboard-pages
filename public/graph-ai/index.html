<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dấu chân dòng tiền — Graph AI</title>
<style>
/* KẾ HOẠCH THIẾT KẾ — "Dấu chân dòng tiền" (Graph AI)
   Người đọc: anh Đại + lead. Câu hỏi khi mở: case này tiền đi từ đâu tới đâu, vì sao đáng ngờ, những ví nào liên quan.
   Palette đêm – ngọc lam (giữ màu đã duyệt ở các bản trước):
     --seed ngọc lam = case / tương tác · --co đỏ = ví đã có cờ (alert hoặc AD giữ) · --tg hổ phách = tài khoản thu gom / dấu hiệu
     --xanh lam = dòng tiền vào–ra · --khong xám = ví chưa cờ. Một màu một nghĩa, không dùng trang trí.
   Type: body 13 · h1 17 · nguồn 11.5 · nhãn chữ hoa 10 · số KPI 28–30 mono · giải thích 11–11.5.
   Bố cục: trái = danh sách case (dính khi cuộn) · phải = băng case (MSISDN + dòng dòng tiền) → 5 thẻ số → sơ đồ
   → hai thẻ cạnh nhau (vì sao / tiền đi thế nào) → bảng ví đầy đủ MSISDN. */
:root{--bg0:#060a12;--bg1:#0b1220;--bg2:#101a2c;--bg3:#16243b;--line:#1c2b45;--line2:#2c4268;
  --tx:#eaf1fb;--tx2:#a9b8cf;--tx3:#74859f;--seed:#3fe0c5;--co:#ff5d73;--khong:#5d6e8c;--trung:#41566f;--tg:#ffb547;--xanh:#7aa2ff;
  --disp:Bahnschrift,"Segoe UI Semibold","Segoe UI",system-ui,sans-serif;--body:"Segoe UI",system-ui,sans-serif;--mono:Consolas,"Cascadia Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg0);color:var(--tx);font:13px/1.5 var(--body)}
body{min-height:100vh;padding:14px 20px 24px;background:radial-gradient(1200px 520px at 0 -10%,rgba(63,224,197,.07),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(122,162,255,.05),transparent 60%),linear-gradient(180deg,#070c16,#060a12 60%)}
.hd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:12px}
h1{font:600 17px/1.2 var(--disp);letter-spacing:.4px;margin:0}
.src{color:var(--tx3);font-size:11.5px}
.hd select{background:var(--bg2);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font:12.5px var(--mono);cursor:pointer}
.lb{font:600 10px var(--disp);letter-spacing:.9px;color:var(--seed);text-transform:uppercase}
.main{display:grid;grid-template-columns:268px minmax(0,1fr);gap:14px;align-items:start}
.pn{background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.pn::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(63,224,197,.07),transparent 70%);pointer-events:none}
/* ---- danh sách case ---- */
.side .pn{padding:12px 10px 10px;display:flex;flex-direction:column}   /* cao bang cot phai — dat trong canBang() */
.dsT{color:var(--tx3);font-size:11.5px;margin:2px 6px 8px}
.ds{overflow:auto;margin:0 -2px;padding-right:2px;flex:1 1 auto;min-height:0}
.ctl{display:flex;flex-direction:column;gap:6px;margin:0 4px 8px}
.ctl input,.ctl select{width:100%;background:var(--bg1);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font:12.5px var(--body);min-width:0}
.ctl input{font-family:var(--mono);letter-spacing:.2px}
.ctl input::placeholder{color:var(--tx3);font-family:var(--body);letter-spacing:0}
.ctl input:focus,.ctl select:focus{outline:none;border-color:var(--seed);box-shadow:0 0 0 2px rgba(63,224,197,.15)}
.ctl .hang{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctl label{display:block;font:600 9.5px var(--disp);letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);margin:0 0 2px 2px}
.ctl .xoa{position:absolute;right:7px;top:5px;background:none;border:0;color:var(--tx3);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1}
.ctl .xoa:hover{color:var(--tx)}
.ctl .tk{position:relative}
.dsT b{color:var(--tx2);font-weight:600}
.dsT .am{color:var(--tg)}
.ca{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:0 8px;padding:8px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.ca+.ca{margin-top:2px}
.ca:hover{background:rgba(255,255,255,.035)}
.ca.on{border-color:var(--seed);background:rgba(63,224,197,.07);box-shadow:0 0 0 1px rgba(63,224,197,.18),0 0 18px rgba(63,224,197,.08)}
.ca .so{font:600 11px var(--mono);color:var(--tx3);padding-top:2px}
.ca .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ca .ma{font:700 13.5px var(--mono);color:var(--tx)}
.ca .r2{color:var(--tx3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ca .r2 b{color:var(--tx2);font-weight:600}
.dg{text-align:right;line-height:1.1;min-width:40px}
.dg b{display:block;font:700 17px var(--mono);color:var(--tx2);font-variant-numeric:tabular-nums}
.dg i{display:block;font:normal 9px var(--disp);letter-spacing:.7px;color:var(--tx3);text-transform:uppercase;margin-top:2px}
.dg.cao b{color:var(--tg);text-shadow:0 0 14px rgba(255,181,71,.45)}
.ca .r3{grid-column:2/4;height:3px;border-radius:2px;background:rgba(44,66,104,.45);margin-top:5px;overflow:hidden}
.ca .r3 span{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#41566f,var(--tx3))}
.ca .r3.cao span{background:linear-gradient(90deg,#c98a2c,var(--tg))}
.ca .kh{color:var(--seed);font-size:10.5px}
.bd{font-size:10.5px;border-radius:999px;padding:1px 8px;white-space:nowrap;border:1px solid var(--line2);color:var(--tx2)}
.bd.ad{border-color:var(--co);color:var(--co);background:rgba(255,93,115,.08)}
.bd.al{border-color:rgba(122,162,255,.5);color:#b8ccff}
/* ---- băng case ---- */
.phai{display:flex;flex-direction:column;gap:14px;min-width:0}
.pn.bang{padding:10px 14px}
.bang .b1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.bang .sp{flex:1 1 0}
@media(min-width:621px){.bang .b1{flex-wrap:nowrap}.bang .b1>*{flex:none}.bang .b1 .hn{flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow:hidden}.bang .b1 .hn.cat{-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}.bang .b1 .hn span{flex:none}.bang .b1 .sp{flex:1 1 0}}
.dgb{font-size:11px;color:var(--tx3);white-space:nowrap}.dgb b{font:700 17px var(--mono);color:var(--tx2);margin-right:2px}.dgb.cao b{color:var(--tg);text-shadow:0 0 14px rgba(255,181,71,.45)}
.kp{font-size:11px;border-radius:999px;padding:1px 9px;border:1px solid rgba(63,224,197,.4);color:#a8f3e6;background:rgba(63,224,197,.07);white-space:nowrap}
.bang .msf{font-size:18px}
.msf{font:700 21px var(--mono);color:var(--seed);letter-spacing:.3px;text-shadow:0 0 22px rgba(63,224,197,.35);user-select:all;word-break:break-all}
.hn{display:flex;flex-wrap:wrap;gap:6px}
.hn span{font-size:11px;border-radius:999px;padding:1px 9px;background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.42);color:#ffd89a}
.flow{display:flex;align-items:stretch;gap:0;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.cot{display:flex;flex-direction:column;gap:5px;justify-content:center;flex:1 1 0;min-width:150px}
.fb{display:grid;grid-template-columns:14px minmax(0,1fr);gap:0 8px;align-items:center;background:rgba(6,10,18,.5);border:1px solid var(--line2);border-radius:10px;padding:5px 10px}
.fb.seed{border-color:var(--seed);background:rgba(63,224,197,.07);box-shadow:0 0 22px rgba(63,224,197,.12)}
.fb.ngang{border-style:dashed}
.fb .ic{grid-row:1/3;width:11px;height:11px;justify-self:center}
.ic.vi{border-radius:50%;background:var(--khong)}.ic.seed{border-radius:50%;background:var(--seed);box-shadow:0 0 10px var(--seed)}
.ic.nh{background:var(--trung);transform:rotate(45deg) scale(.85);border-radius:1px}.ic.tk{background:var(--trung);border-radius:2px;outline:1.5px solid var(--tg);outline-offset:2px}
.fb .t{font:600 10px var(--disp);letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);line-height:1.3}
.fb .tv{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.fb .v{font:700 14px/1.3 var(--mono);color:var(--tx);white-space:nowrap}
.fb .v small{font:11px var(--body);color:var(--tx3);margin-left:5px}
.fb .s{grid-column:2;color:var(--tx2);font-size:11px;line-height:1.35}
.ar{flex:0 0 46px;position:relative;align-self:center;height:14px}
.ar::before{content:"";position:absolute;left:4px;right:8px;top:6px;height:2px;background:linear-gradient(90deg,rgba(63,224,197,.15),rgba(63,224,197,.7));border-radius:2px}
.ar::after{content:"";position:absolute;right:2px;top:2px;border:5px solid transparent;border-left:7px solid rgba(63,224,197,.85);border-right:0}
.ar i{position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--seed);box-shadow:0 0 8px var(--seed);animation:chay 1.8s linear infinite}
.ar.trai::before{background:linear-gradient(270deg,rgba(255,181,71,.15),rgba(255,181,71,.7))}
.ar.trai::after{right:auto;left:2px;border-left:0;border-right:7px solid rgba(255,181,71,.85)}
.ar.trai i{background:var(--tg);box-shadow:0 0 8px var(--tg);animation-name:chayTrai}
@keyframes chay{from{left:4px}to{left:calc(100% - 14px)}}@keyframes chayTrai{from{left:calc(100% - 14px)}to{left:4px}}
.kieu{margin-top:12px;color:var(--tx3);font-size:11.5px}
.kieu b{color:var(--tx);font-weight:600;letter-spacing:.2px}
.canh{margin-top:6px;color:var(--tg);font-size:11.5px}
/* ---- thẻ số ---- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.k{background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-left:3px solid var(--c);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.k::after{content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%)}
.k .t{font:600 10px var(--disp);letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .n{font:700 28px/1.25 var(--mono);color:var(--c);white-space:nowrap;text-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent);font-variant-numeric:tabular-nums}
.k .n small{font:600 13px var(--mono);color:var(--tx3);text-shadow:none;margin:0 3px}
.k .g{color:var(--tx3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- sơ đồ ---- */
.box{background:linear-gradient(180deg,rgba(16,26,44,.92),rgba(11,18,32,.95));border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cv{display:block;width:100%;height:600px;cursor:grab;touch-action:none}
#cv.keo{cursor:grabbing}
.box:fullscreen,.box.pf{display:flex;flex-direction:column;border-radius:0;border:0;background:#060a12}
.box.pf{position:fixed;inset:0;z-index:30}
.box:fullscreen #cv,.box.pf #cv{flex:1 1 0;min-height:0;height:auto}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;padding:7px 14px;border-top:1px solid var(--line);color:var(--tx3);font-size:11px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg i.sq{border-radius:2px;background:var(--trung)}.lg i.dm{border-radius:1px;transform:rotate(45deg) scale(.82);background:var(--trung)}
.lg i.gp{background:none;border:1px dashed var(--tx3)}
.foot button{background:var(--bg2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
.foot button:hover{border-color:var(--line2);color:var(--tx)}
.foot .ic2{padding:5px 7px;display:inline-flex;align-items:center;vertical-align:middle}
.foot .ic2 svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot .ic2 .nho{display:none}.box.fs .foot .ic2 .nho{display:inline}.box.fs .foot .ic2 .lon{display:none}
/* ---- dưới sơ đồ ---- */
.duoi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:stretch}
.duoi .pn{font-size:13px;line-height:1.6;color:var(--tx2)}
.duoi h3,.bv h3{margin:0 0 10px;display:flex;gap:10px;align-items:baseline;font:600 14px var(--disp);color:var(--tx);letter-spacing:.2px}
.ly{color:var(--tx2)}
.hl{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.hl div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.hl span{font-size:11px;border-radius:999px;padding:1px 9px;background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.42);color:#ffd89a;white-space:nowrap}
.hl em{font-style:normal;color:var(--tx2);font-size:12.5px}
.tl{position:relative;padding-left:4px}
.st{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 12px;padding:8px 0;position:relative}
.st+.st{border-top:1px dashed rgba(44,66,104,.6)}
.st .nb{font:700 11.5px var(--mono);color:var(--seed);padding-top:1px;white-space:nowrap}
.st .nb.am{color:var(--xanh)}
.st .tx b{color:var(--tx);font-family:var(--mono);font-weight:700}
.ghi{margin-top:10px;color:var(--tx3);font-size:11.5px;line-height:1.55}
/* ---- bảng ví ---- */
.bv .g2{color:var(--tx3);font:400 12px var(--body)}
.bv table{width:100%;border-collapse:collapse;font-size:12.5px}
.bv th{text-align:left;font:600 10px var(--disp);letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);padding:7px 10px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
.bv th:hover{color:var(--tx)}.bv th .s{opacity:.4}.bv th.on .s{opacity:1;color:var(--seed)}
.bv td{padding:7px 10px;border-bottom:1px solid rgba(28,43,69,.7);vertical-align:top}
.bv tr:hover td{background:rgba(63,224,197,.04)}
.bv td.m{font:600 13px var(--mono);color:var(--tx);white-space:nowrap}
.bv td.n{font-family:var(--mono);color:var(--tx2);white-space:nowrap;text-align:right}
.bv td .co{color:var(--co);font-weight:600}.bv td .kb{color:var(--tx3);font-size:11.5px}
.bv .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--khong)}.bv .dot.co{background:var(--co);box-shadow:0 0 8px var(--co)}
.bv .cuon{overflow-x:auto}
.note{color:var(--tx3);font-size:11.5px;line-height:1.6;padding:0 2px}
/* ---- dòng lý do ngắn + nút chi tiết trên băng case ---- */
.b3{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.b3 .ly1{flex:1 1 auto;min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b3 .ly1 b{color:var(--tx);font-weight:600}
.nut{flex:none;background:rgba(63,224,197,.1);border:1px solid var(--seed);color:var(--seed);border-radius:10px;padding:7px 14px;font:600 12.5px var(--body);cursor:pointer;transition:box-shadow .15s,transform .15s}
.nut:hover{box-shadow:0 0 18px rgba(63,224,197,.3);transform:translateY(-1px)}
.nut:focus-visible,.pn button:focus-visible{outline:2px solid var(--seed);outline-offset:2px}
/* ---- popup chi tiết ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.72);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:28px 20px;overflow:auto}
.ov[hidden]{display:none}
.pop{width:min(1280px,100%);background:linear-gradient(180deg,#0f192b,#0b1322);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:mo .22s cubic-bezier(.22,1,.36,1)}
@keyframes mo{from{opacity:0;transform:scale(.985) translateY(8px)}to{opacity:1;transform:none}}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(15,25,43,.96);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.ph .msf{font-size:18px}
.ph .sp{flex:1}
.ph button{background:var(--bg2);border:1px solid var(--line2);color:var(--tx2);border-radius:9px;min-width:34px;height:32px;font:600 15px var(--body);cursor:pointer}
.ph button:hover{color:var(--tx);border-color:var(--seed)}
.ph .vt{color:var(--tx3);font:12px var(--mono)}
.pb{padding:18px;display:flex;flex-direction:column;gap:14px}
.tip{position:fixed;z-index:40;pointer-events:none;background:#0d1626;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;max-width:340px;box-shadow:0 12px 30px rgba(0,0,0,.55);font-size:12px;line-height:1.5}
.tip[hidden]{display:none}
.tip b{display:block;font:600 13px var(--mono);margin-bottom:2px;word-break:break-all}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--tx2)}
.tip .r span:last-child{font-family:var(--mono);color:var(--tx);white-space:nowrap}
.tip .g{color:var(--tx3);margin-top:3px}
.rong{padding:40px;text-align:center;color:var(--tx3)}
/* vào trang một lần */
body.vao .pn,body.vao .k,body.vao .box{animation:len .45s cubic-bezier(.22,1,.36,1) both}
body.vao .k:nth-child(2){animation-delay:.05s}body.vao .k:nth-child(3){animation-delay:.1s}body.vao .k:nth-child(4){animation-delay:.15s}body.vao .k:nth-child(5){animation-delay:.2s}
@keyframes len{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.main{grid-template-columns:1fr}.side .pn{max-height:300px}.duoi{grid-template-columns:1fr}}
@media(max-width:620px){body{padding:12px}.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.ov{padding:0}.pop{border-radius:0}.ph{flex-wrap:wrap;border-radius:0}.ph .msf{font-size:14px}.flow{flex-direction:column}.ar{transform:rotate(90deg);align-self:center;flex:0 0 26px;width:40px}.msf{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="vao">
<header class="hd"><h1>Dấu chân <span style="color:var(--seed);text-shadow:0 0 18px rgba(63,224,197,.4)">dòng tiền</span></h1><span class="lb" title="Truy vết tiền đi qua các ví trung gian bằng đồ thị">Graph AI</span><select id="ngay" aria-label="Chọn ngày"></select><div class="src" id="src"></div></header>
<div class="main">
<aside class="side"><div class="pn"><div class="lb" style="margin:0 6px 6px">Case trong ngày</div>
  <div class="ctl">
    <div class="tk"><input id="tim" type="search" placeholder="Tìm MSISDN (gõ một phần)…" autocomplete="off" spellcheck="false" aria-label="Tìm theo MSISDN"><button class="xoa" id="timXoa" hidden aria-label="Xoá tìm kiếm">✕</button></div>
    <div class="hang"><div><label for="soHien">Hiển thị</label><select id="soHien"></select></div>
      <div><label for="sapXep">Sắp xếp</label><select id="sapXep"><option value="diem-">Điểm cấu trúc ↓</option><option value="diem+">Điểm cấu trúc ↑</option><option value="alert-">Điểm alert ↓</option><option value="alert+">Điểm alert ↑</option><option value="ms+">MSISDN A → Z</option><option value="ms-">MSISDN Z → A</option></select></div></div>
  </div>
  <div class="dsT" id="dsT"></div><div class="ds" id="ds"></div></div></aside>
<section class="phai">
  <div class="pn bang" id="bang"></div>

function tinhVis(){
  const cs=DAY().cases,q=loc.tim.trim().toLowerCase();let ds=cs.map((c,i)=>({c,i,kh:null}));
  if(q){   // tìm trong MSISDN của case VÀ của mọi ví trong dòng tiền; bỏ qua giới hạn số hiển thị
    ds=ds.map(o=>{const ms=msCase(o.c).toLowerCase();if(ms.includes(q))return o;
      const n=o.c.nodes.find(x=>x.ms&&x.k!=='seed'&&x.ms.toLowerCase().includes(q));return n?Object.assign(o,{kh:n.ms}):null;}).filter(Boolean);
  }else{
    const goc=ds.slice().sort((p,r)=>dCT(r.c)-dCT(p.c)||p.i-r.i);   // "điểm cao nhất" luôn tính theo điểm cấu trúc, không theo kiểu sắp xếp đang chọn
    const giu=loc.hien==='cao'?goc.filter(o=>laCao(o.c)):loc.hien==='all'?goc:goc.slice(0,+loc.hien);
    const tap=new Set(giu.map(o=>o.i));
    ds=ds.filter(o=>tap.has(o.i)||o.c.nguon.nguon==='AD'||o.c.nguon.nguon==='THEM');   // ví AD giữ + ví đối chứng luôn hiện
  }
  const [k,h]=[loc.sap.slice(0,-1),loc.sap.slice(-1)==='-'?-1:1];
  const kv={diem:o=>dCT(o.c),alert:o=>dAL(o.c),ms:o=>msCase(o.c)};
  ds.sort((p,r)=>{const a=kv[k](p),b=kv[k](r);return (a>b?1:a<b?-1:0)*h||p.i-r.i;});
  vis=ds;
}

/* tiền đi thế nào: tự sinh theo từng bước của đường đi thật */
function chuoi(c){
  const N=c.nodes,E=c.edges,by={};N.forEach((n,i)=>{(by[n.buoc]=by[n.buoc]||[]).push(i);});
  const tienVao=i=>E.filter(e=>e.t===i).reduce((s,e)=>s+(e.tong||0),0),tienRa=i=>E.filter(e=>e.s===i).reduce((s,e)=>s+(e.tong||0),0);
  const out=[];const t=c.tt;
  Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(b=>{
    const ids=by[b],k=x=>ids.filter(i=>N[i].k===x);
    if(b===0){out.push(['Case','Ví <b>'+esc(c.id)+'</b> nhận <b>'+fmtT(t.vao)+'</b> ('+nf(t.n_vao)+' GD), chuyển đi <b>'+fmtT(t.ra)+'</b> ('+nf(t.n_ra)+' GD)'
      +(t.ra24!=null?'; <b>'+Math.round(t.ra24*100)+'%</b> tiền vào ra trong 24 giờ, giữ tiền trung vị <b>'+String(t.lag_tv_h).replace('.',',')+' giờ</b>':'')+'.']);return;}
    const p=[];
    if(b<0){
      const nh=k('nh');if(nh.length)p.push(nh.length+' ngân hàng nạp <b>'+fmtT(nh.reduce((s,i)=>s+tienRa(i),0))+'</b> (không rõ người gửi)');
      const vi=k('vi');if(vi.length)p.push(vi.length+' ví chuyển vào <b>'+fmtT(vi.reduce((s,i)=>s+tienRa(i),0))+'</b>'+(vi.filter(i=>coCo(N[i])).length?', '+vi.filter(i=>coCo(N[i])).length+' ví có cờ':''));
      if(k('sodu').length)p.push('một phần là số dư có sẵn trước kỳ');
      const gp=k('gop');if(gp.length)p.push(gp.map(i=>esc(N[i].id)).join(', ')+' (nhỏ, ẩn khỏi hình)');
      out.push(['Bước '+b,'Tiền đến từ: '+p.join('; ')+'.']);return;}
    const vi=ids.filter(i=>N[i].k==='vi'&&!N[i].dg),dg=ids.filter(i=>N[i].dg),tk=k('tk').filter(i=>!N[i].n2),tk2=k('tk').filter(i=>N[i].n2),rut=k('rut'),gp=k('gop');
    if(tk.length){const tg=tk.filter(i=>(N[i].be||0)>DAY().meta.be_thu_gom).length;p.push('<b>'+tk.length+'</b> tài khoản nhận <b>'+fmtT(tk.reduce((s,i)=>s+tienVao(i),0))+'</b>'+(tg?' ('+tg+' là tài khoản thu gom)':''));}
    if(vi.length)p.push(vi.length+' ví nhận <b>'+fmtT(vi.reduce((s,i)=>s+tienVao(i),0))+'</b>'+(vi.filter(i=>coCo(N[i])).length?', '+vi.filter(i=>coCo(N[i])).length+' ví có cờ':''));
    if(rut.length)p.push('rút về ngân hàng <b>'+fmtT(rut.reduce((s,i)=>s+tienVao(i),0))+'</b>');
    if(gp.length)p.push(gp.map(i=>esc(N[i].id)).join(', ')+' (nhỏ, ẩn khỏi hình)');
    if(dg.length){const cc=dg.filter(i=>coCo(N[i])).length;p.push('các tài khoản đó còn nhận tiền từ ví khác — hình hiện <b>'+dg.length+'</b> ví'+(cc?', <b style="color:var(--co)">'+cc+' có cờ</b>':''));}
    if(tk2.length)p.push('những ví đó cũng chuyển tới <b>'+tk2.length+'</b> tài khoản đông người gửi khác');
    if(p.length)out.push(['Bước +'+b,p.join('; ')+'.']);
  });
  return out;
}

function veBangVi(){
  const c=C,vs=c.nodes.map((n,i)=>Object.assign({_i:i},n)).filter(n=>n.ms&&n.k!=='seed');
  if(!vs.length){$('bangvi').innerHTML='<h3><span class="lb">Ví liên quan</span>không có ví nào khác trong dòng tiền</h3>';return;}
