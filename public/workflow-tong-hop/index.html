<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Workflow tổng hợp</title>
<style>
/* KẾ HOẠCH THIẾT KẾ — trang "cổng" gom 8 workflow của 3 hệ thống; mỗi màn chỉ hiện MỘT workflow.
   Hai tầng tab: hàng 1 = HỆ THỐNG (3 thẻ lớn, mỗi hệ thống một màu), hàng 2 = CHẾ ĐỘ XEM của hệ thống đó (viên thuốc) + một dòng mô tả cố định chiều cao.
   Mỗi hệ thống là một iframe giữ nguyên trang gốc (tạo lười, giữ trạng thái khi chuyển tab); trang này điều khiển chế độ của nó và ẩn tiêu đề/tab trùng lặp.
   Màu: cyan = F2DR Vận hành · tím = Bot Telegram · lục = Task hằng ngày. Nền cùng gia đình với các trang workflow. */
:root{
  color-scheme:dark;
  --nen:#02050b; --canvas:#03060b; --giay:#070d19; --vien:#1d2d4d; --vien2:#34507f;
  --chu:#f4f8fd; --chu-nhat:#bac8e4; --chu-mo:#8a99b6; --kenh:#3d4f72;
  --mono:"Cascadia Mono",Consolas,"Segoe UI Mono",monospace; --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1000px 420px at 6% -8%,#0b1730 0%,transparent 62%),linear-gradient(180deg,#040810,var(--nen) 70%);
  color:var(--chu);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;padding:12px 18px 12px;gap:9px}
/* ---- hàng 1 */
.top{flex:none;display:flex;align-items:center;gap:18px}
.brand{flex:none;min-width:0}
.brand .nhan{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--chu-mo)}
.brand h1{margin:2px 0 0;font-size:20px;letter-spacing:.2px;font-weight:700;white-space:nowrap}
.brand h1 em{font-style:normal;color:#33e4ff;text-shadow:0 0 18px rgba(51,228,255,.4)}
.nhom{flex:1;min-width:0;display:flex;gap:10px}
.gt{--m:#33e4ff;flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:8px 14px;border-radius:13px;text-align:left;color:var(--chu-nhat);
  background:linear-gradient(135deg,color-mix(in srgb,var(--m) 9%,var(--giay)),#050a14);border:1.6px solid color-mix(in srgb,var(--m) 38%,var(--vien));
  transition:border-color .2s,box-shadow .2s,transform .2s,color .2s}
.gt:hover{color:var(--chu);border-color:color-mix(in srgb,var(--m) 70%,var(--vien));transform:translateY(-1px)}
.gt:focus-visible{outline:2px solid var(--m);outline-offset:2px}
.gt .so{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--mono);color:var(--m);
  background:color-mix(in srgb,var(--m) 16%,var(--nen));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--m) 45%,transparent)}
.gt b{display:block;font-size:14px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{display:block;font-size:11.5px;color:var(--chu-mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .dem{margin-left:auto;flex:none;font:700 11px var(--mono);padding:2px 8px;border-radius:9px;border:1.3px solid color-mix(in srgb,var(--m) 65%,transparent);color:var(--m)}
.gt[aria-selected="true"]{color:var(--chu);border-color:var(--m);background:linear-gradient(135deg,color-mix(in srgb,var(--m) 20%,var(--giay)),#050a14);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--m) 17%,transparent),0 0 28px -8px var(--m)}
.gt[aria-selected="true"] .so{background:var(--m);color:#04101a}
.ctl{flex:none;display:flex;align-items:center;gap:7px}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--vien);background:var(--giay);color:var(--chu-nhat);padding:0}
.ib:hover{color:var(--chu);border-color:var(--kenh)}
.ib svg{width:17px;height:17px}
.dem2{font:600 12px var(--mono);color:var(--chu-nhat);min-width:46px;text-align:center}
/* ---- hàng 2 */
.sub{flex:none;display:flex;align-items:center;gap:14px;height:42px}
.vt{flex:none;display:flex;gap:6px;padding:4px;border-radius:13px;background:var(--giay);border:1px solid var(--vien)}
.vt button{--m:#33e4ff;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--chu-nhat);white-space:nowrap}
.vt button:hover{color:var(--chu)}
.vt button[aria-selected="true"]{color:var(--chu);background:color-mix(in srgb,var(--m) 15%,var(--giay));border-color:color-mix(in srgb,var(--m) 75%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--m) 13%,transparent),0 0 20px -8px var(--m)}
.mt{flex:1;min-width:0;font-size:13px;color:var(--chu-nhat);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt b{color:var(--chu)}
/* cụm điều khiển (EN/VI · Dừng · đồng hồ) lấy từ trang con, đặt cạnh tab chế độ để workflow có thêm chỗ */
.ctl2{flex:none;display:flex;align-items:center;gap:8px}
.ctl2.an{visibility:hidden}
.seg{display:inline-flex;border:1px solid var(--vien);border-radius:9px;overflow:hidden;background:var(--giay)}
.seg button{border:0;background:transparent;padding:8px 12px;font:600 12px var(--mono);color:var(--chu-nhat)}
.seg button+button{border-left:1px solid var(--vien)}
.seg button.on{background:color-mix(in srgb,var(--m) 30%,var(--giay));color:var(--chu);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--m) 65%,transparent)}
.pb{border:1px solid var(--vien);background:var(--giay);border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--chu-nhat);white-space:nowrap}
.pb:hover{color:var(--chu);border-color:var(--kenh)}
.gio{min-width:84px;text-align:center;padding:7px 12px;border-radius:10px;background:color-mix(in srgb,var(--m) 13%,var(--giay));border:1px solid color-mix(in srgb,var(--m) 55%,transparent);
  font:700 13px var(--mono);color:var(--chu);text-shadow:0 0 14px color-mix(in srgb,var(--m) 55%,transparent);white-space:nowrap}
.tong2{flex:none;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--chu-mo);white-space:nowrap}
.tong2:empty{display:none}
.tong2 em{font-style:normal;color:#7dffb8;font-size:12.5px;text-shadow:0 0 14px rgba(46,233,138,.4)}
/* ---- sân khấu */
.stage{flex:1;min-height:0;position:relative;border:1px solid var(--vien2);border-radius:14px;background:var(--canvas);overflow:hidden;box-shadow:0 18px 50px -24px #000}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--canvas);display:none}
.stage iframe.on{display:block}
.tai{position:absolute;inset:0;display:grid;place-items:center;color:var(--chu-mo);font:600 12px var(--mono);letter-spacing:.1em}
@media (max-width:1100px){.brand .nhan{display:none}.gt small{display:none}.gt{padding:7px 10px}}
@media (max-width:820px){.top{flex-wrap:wrap}.nhom{order:3;flex-basis:100%}.mt{display:none}.vt{overflow-x:auto;max-width:100%}.gt b{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand">
      <div class="nhan">F2DR · Quản trị rủi ro</div>
      <h1>Workflow <em>tổng hợp</em></h1>
    </div>
    <div class="nhom" id="nhom" role="tablist" aria-label="Hệ thống"></div>
    <div class="ctl">
      <button class="ib" id="bTruoc" title="Workflow trước ( [ )" aria-label="Workflow trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="dem2" id="dem2"></span>
      <button class="ib" id="bSau" title="Workflow sau ( ] )" aria-label="Workflow sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="ib" id="bFull" title="Toàn màn hình (F)" aria-label="Toàn màn hình"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="sub">
    <div class="vt" id="vt" role="tablist" aria-label="Chế độ xem"></div>
    <div class="ctl2 an" id="ctl2">
      <div class="seg" id="hLang"><button data-n="en">EN</button><button data-n="vi">VI</button></div>
      <button class="pb" id="hPause" type="button"></button>
      <span class="gio" id="hGio"></span>
    </div>
    <div class="tong2" id="hTong"></div>
    <div class="mt" id="mt"></div>
  </div>
  <div class="stage" id="stage"><div class="tai">ĐANG TẢI…</div></div>
</div>

<script>
var DOCS={"van":"<title>Luồng F2DR 7h sáng<\/title>\n\n<style>\n  :root{\n    color-scheme: light;\n    --nen:#eceff4; --canvas:#fafbfd; --cham:#dae1ea; --khoi:#f0f3f7;\n    --giay:#ffffff; --vien:#d6dde6; --chu:#0f161e; --chu-nhat:#57646f; --chu-mo:#8794a2;\n    --kenh:#b0bcc9;\n    --g1:#0b6f84; --g1n:#dcf0f3;\n    --g2:#54399f; --g2n:#e8e2f8;\n    --g3:#a32a6b; --g3n:#fbe2ee;\n    --g4:#9c5c0a; --g4n:#fbeacf;\n    --g5:#1f7a4d; --g5n:#e0f0e7;\n    --g6:#2f5fd0; --g6n:#dfe8fb;\n    --gx:#a82b25; --gxn:#fbe2df;\n  }\n  @media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n    color-scheme: dark;\n    --nen:#06090d; --canvas:#0a0e14; --cham:#1a222c; --khoi:#080c11;\n    --giay:#1b232d; --vien:#2f3a47; --chu:#e9eef4; --chu-nhat:#a0aebd; --chu-mo:#6f7d8d;\n    --kenh:#3d4956;\n    --g1:#50cade; --g1n:#0f353d;\n    --g2:#a794f5; --g2n:#272143;\n    --g3:#f07ab2; --g3n:#3a1a2c;\n    --g4:#e5aa52; --g4n:#3b2d12;\n    --g5:#5ecd8b; --g5n:#14331f;\n    --g6:#7aa2ff; --g6n:#17244a;\n    --gx:#f3776e; --gxn:#391b19;\n  }}\n  :root[data-theme=\"dark\"]{\n    color-scheme: dark;\n    --nen:#06090d; --canvas:#0a0e14; --cham:#1a222c; --khoi:#080c11;\n    --giay:#1b232d; --vien:#2f3a47; --chu:#e9eef4; --chu-nhat:#a0aebd; --chu-mo:#6f7d8d;\n    --kenh:#3d4956;\n    --g1:#50cade; --g1n:#0f353d;\n    --g2:#a794f5; --g2n:#272143;\n    --g3:#f07ab2; --g3n:#3a1a2c;\n    --g4:#e5aa52; --g4n:#3b2d12;\n    --g5:#5ecd8b; --g5n:#14331f;\n    --g6:#7aa2ff; --g6n:#17244a;\n    --gx:#f3776e; --gxn:#391b19;\n  }\n\n  html,body{ height:100%; }\n  body{ background:var(--nen); color:var(--chu); margin:0; overflow:hidden;\n        font-family:\"IBM Plex Sans\",\"Segoe UI\",system-ui,sans-serif;\n        display:flex; flex-direction:row; box-sizing:border-box; }\n\n  /* Cot trai ~1/4: tieu de, so lieu, chu giai, nut. Truoc day nam ngang phia\n     tren, an mat chieu cao cua so do. */\n  .ben{ flex:none; width:clamp(236px,24vw,340px); box-sizing:border-box;\n        padding:14px 12px 12px 16px; display:flex; flex-direction:column; gap:14px;\n        overflow-y:auto; }\n  .nhan{ font-size:9.5px; letter-spacing:.17em; text-transform:uppercase;\n         color:var(--chu-nhat); font-weight:600; }\n  h1{ font-size:clamp(17px,1.6vw,22px); line-height:1.15; margin:3px 0 0;\n      letter-spacing:-.022em; font-weight:700; }\n  /* 3 cot cho 5 so nho; so to 5'52\" nam ngang cung nhan cua no -> bot 2 hang */\n  .so-lieu{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px 6px; }\n  .so-lieu b{ display:block; font-size:15px; font-weight:600; letter-spacing:-.018em;\n              font-variant-numeric:tabular-nums; line-height:1.1; }\n  .so-lieu span{ display:block; font-size:9.5px; line-height:1.25; color:var(--chu-nhat); }\n  .so-lieu .to{ grid-column:1/-1; display:flex; align-items:baseline; gap:9px;\n                padding-bottom:9px; border-bottom:1px solid var(--vien); }\n  .so-lieu .to b{ font-size:22px; color:var(--g5); }\n\n  .tieu{ font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;\n         color:var(--chu-mo); font-weight:600; margin-bottom:1px; }\n  .thanh{ display:flex; flex-direction:column; gap:6px; font-size:11px;\n          color:var(--chu-nhat); }\n  .thanh i{ display:inline-block; width:10px; height:10px; border-radius:3px;\n            margin-right:8px; vertical-align:-1px; }\n  .nut-td{ margin-top:auto; display:flex; flex-direction:column; gap:5px; }\n  button{ font-family:inherit; font-size:10.5px; font-weight:600; color:var(--chu-nhat);\n          background:var(--giay); border:1px solid var(--vien); border-radius:8px;\n          padding:5px 10px; cursor:pointer; }\n  button:hover{ color:var(--chu); border-color:var(--kenh); }\n  button:focus-visible{ outline:2px solid var(--g1); outline-offset:1px; }\n  button.chinh{ color:var(--giay); background:var(--g3); border-color:var(--g3); }\n  button.chinh:hover{ color:var(--giay); filter:brightness(1.08); }\n  .keo-hint{ color:var(--chu-mo); font-size:10.5px; }\n\n  .sanh{ flex:1; min-width:0; margin:12px 12px 12px 0; border:1px solid var(--vien);\n         border-radius:14px; background:var(--canvas);\n         background-image:radial-gradient(var(--cham) 1.1px, transparent 1.1px);\n         background-size:22px 22px; padding:5px; box-sizing:border-box; position:relative; }\n\n  /* Man thap: chu giai chia 2 cot de cot trai van khong phai cuon */\n  @media (max-height:480px){\n    .thanh{ display:grid; grid-template-columns:1fr 1fr; gap:5px 8px; }\n    .thanh .tieu{ grid-column:1/-1; }\n  }\n  /* Man hep (dien thoai): cot trai len tren, so do xuong duoi. */\n  @media (max-width:760px){\n    body{ flex-direction:column; overflow:auto; }\n    .ben{ width:auto; overflow:visible; gap:14px; }\n    .so-lieu{ grid-template-columns:repeat(3,1fr); }\n    .nut-td{ flex-direction:row; flex-wrap:wrap; }\n    .sanh{ flex:none; height:75vh; margin:0 12px 12px; }\n  }\n  .sanh svg{ display:block; width:100%; height:100%; touch-action:none; }\n  text{ font-family:\"IBM Plex Sans\",system-ui,sans-serif; }\n  .nut{ cursor:grab; }\n  .nut.dang-keo{ cursor:grabbing; }\n  .t-lan{ font-size:13.5px; font-weight:600; letter-spacing:.12em; }\n  .t-gio{ font-size:11.5px; font-weight:600; font-family:\"IBM Plex Mono\",monospace; }\n  .t-canh{ font-size:13px; font-weight:600; }\n\n  .hop-dan{ position:absolute; inset:auto 12px 12px auto; width:min(420px,70%);\n            background:var(--giay); border:1px solid var(--vien); border-radius:12px;\n            padding:12px; box-shadow:0 8px 28px -10px rgba(10,16,24,.4); }\n  .hop-dan p{ margin:0 0 7px; font-size:11.5px; color:var(--chu-nhat); }\n  .hop-dan textarea{ width:100%; box-sizing:border-box; height:90px; resize:vertical;\n                     font-family:\"IBM Plex Mono\",monospace; font-size:10.5px;\n                     color:var(--chu); background:var(--canvas);\n                     border:1px solid var(--vien); border-radius:8px; padding:7px; }\n  .hop-dan .hang{ display:flex; gap:7px; justify- x-height:640px){.top .phu,.chan{display:none}.ct{min-height:62px}.ct p{font-size:11.5px}}\n.vao{animation:vao .5s cubic-bezier(.22,1,.36,1) both}\n@keyframes vao{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){.vach.dang::after{animation:none}.vao{animation:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <div class=\"top vao\">\n    <div class=\"l\">\n      <h1 id=\"h1\"><\/h1>\n      <p class=\"phu\" id=\"phu\"><\/p>\n    <\/div>\n    <div class=\"ctl\">\n      <div class=\"seg\" id=\"ngon\"><button data-n=\"en\">EN<\/button><button data-n=\"vi\">VI<\/button><\/div>\n      <button class=\"btn\" id=\"bPause\"><\/button>\n      <span class=\"clock\" id=\"clock\">0:00<\/span>\n      <button class=\"btn\" id=\"bFull\" title=\"Fullscreen\">⛶<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"tabs vao\" id=\"tabs\"><\/div>\n  <div class=\"chart vao\" id=\"chart\" style=\"animation-delay:.06s\">\n    <div class=\"axis\" id=\"axis\"><\/div>\n    <div class=\"pl\" id=\"pl\"><i id=\"plI\"><\/i><\/div>\n    <svg class=\"links\" id=\"links\"><\/svg>\n  <\/div>\n  <div class=\"ct vao\" id=\"ct\" style=\"animation-delay:.12s\"><\/div>\n  <div class=\"chan\" id=\"chan\"><\/div>\n<\/div>\n<div class=\"tip\" id=\"tip\" hidden><\/div>\n\n<script>\n(function(){\n\"use strict\";\nfunction L(v,e){return {v:v,e:e};}\nvar NN=\"vi\";\ntry{var _n=localStorage.getItem(\"bot-tele-ngon\");if(_n===\"vi\"||_n===\"en\")NN=_n;}catch(e){}\nfunction T(x){return (x&&typeof x===\"object\")?x[NN===\"vi\"?\"v\":\"e\"]:x;}\nfunction esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c];});}\n\n/* ===== 7 làn: mỗi nơi chạy một màu ===== */\nvar LANES=[\n {id:\"U\",ky:\"T\",m:\"#2ee8ff\",ten:L(\"Anh Đại · Telegram\",\"You · Telegram\"),sub:L(\"app Telegram trên điện thoại\",\"Telegram app\")},\n {id:\"R\",ky:\"☁\",m:\"#ff9550\",ten:L(\"Trạm chuyển\",\"Relay\"),sub:L(\"Cloudflare Worker · thử lại ×2\",\"Cloudflare Worker · retry ×2\")},\n {id:\"B\",ky:\"⚙\",m:\"#2ee98a\",ten:L(\"Bot Apps Script\",\"Apps Script bot\"),sub:L(\"doPost · trigger 1′ · canh gác 10′\",\"doPost · 1′ trigger · 10′ watchdog\")},\n {id:\"G\",ky:\"✦\",m:\"#b98cff\",ten:L(\"Gemini\",\"Gemini\"),sub:L(\"5 khóa × 3 model xoay vòng\",\"5 keys × 3 models, rotating\")},\n {id:\"S\",ky:\"▤\",m:\"#e5aa52\",ten:L(\"Google Sheet & Drive\",\"Google Sheet & Drive\"),sub:L(\"sổ dữ liệu · kho file\",\"data log · file store\")},\n {id:\"P\",ky:\"▣\",m:\"#f07ab2\",ten:L(\"PC công ty\",\"Work PC\"),sub:L(\"Task Scheduler 2′ → D:\\\\Telegram\",\"Task Scheduler 2′ → D:\\\\Telegram\")},\n {id:\"C\",ky:\"C\",m:\"#5ea8ff\",ten:L(\"Claude trên PC\",\"Claude on the PC\"),sub:L(\"chỉ làm khi anh nhắn (remote)\",\"only when you ask (remote)\")}\n];\nvar LID={};LANES.forEach(function(l,i){LID[l.id]=i;});\n\n/* ===== 3 kịch bản. d = độ dài, after = nối sau bước nào, gap = nghỉ (mặc định .5), t0 = đặt cứng ===== */\nvar KB=[\n{id:\"chat\",ten:L(\"Chat với bot\",\"Chat with the bot\"),so:\"1\",dur:15,\n phu:L(\"Một lượt hỏi – đáp. Bấm tên một làn để làm sáng nó, bấm một thanh để ghim chi tiết, bấm trục giờ để tua.\",\n       \"One question and answer. Click a lane to highlight it, click a bar to pin its details, click the time axis to scrub.\"),\n tong:L(\"Một lượt trả lời\",\"One reply\"),tongv:L(\"≈ 2–4 giây\",\"≈ 2–4 s\"),\n steps:[\n  {id:\"c1\",lane:\"U\",d:1,t0:0,ten:L(\"Anh nhắn tin\",\"You send a message\"),ct:L(\"Nhắn riêng cho bot, hoặc trong nhóm thì tag @bot / reply vào tin của bot.\",\"DM the bot, or in a group tag @bot / reply to the bot.\")},\n  {id:\"c2\",lane:\"R\",d:1,after:\"c1\",ten:L(\"Trạm chuyển nhận\",\"Relay receives\"),ct:L(\"Worker trả 200 cho Telegram NGAY (Telegram không chờ), rồi chuyển tin sang Apps Script ở nền; thử lại 2 lần, hỏng hẳn thì nhắn riêng báo anh Đại.\",\"The Worker answers Telegram with 200 at once, then forwards the update to Apps Script in the background; retries twice, and DMs you if it still fails.\")},\n  {id:\"c3\",lane:\"B\",d:1.4,after:\"c2\",ten:L(\"Kiểm trùng + quyền\",\"Dedupe + permission\"),ct:L(\"doPost: khóa chống xử lý trùng một tin; kiểm người gửi (chat riêng chỉ anh Đại; nhóm chỉ nhóm đã biết và phải tag bot).\",\"doPost: lock against double handling; check the sender (private chat = you only; groups must be known and tag the bot).\")},\n  {id:\"c4\",lane:\"S\",d:1.2,after:\"c3\",ten:L(\"Ghi sổ, đọc bối cảnh\",\"Log + read context\"),ct:L(\"Ghi tin vào sổ 'dem', rồi đọc lại 20 → 50 → 90 tin gần nhất của ĐÚNG cuộc trò chuyện làm bối cảnh (thiếu mới đọc thêm).\",\"Logs the message to the 'dem' tab, then reads the last 20 → 50 → 90 messages of THIS conversation as context (only widens if needed).\")},\n  {id:\"c5\",lane:\"G\",d:3,after:\"c4\",ai:1,ten:L(\"Gemini soạn trả lời\",\"Gemini writes the reply\"),ct:L(\"Gửi bối cảnh + persona hóm hỉnh (khịa anh Đại, lịch sự với người khác) cho Gemini. Gặp giới hạn thì đổi khóa/model; hết hạn mức thì nhắn báo anh.\",\"Sends the context + the witty persona (roasts you, polite to others) to Gemini. On rate limits it rotates key/model; if exhausted it alerts you.\")},\n  {id:\"c6\",lane:\"B\",d:1,after:\"c5\",ten:L(\"Gửi trả lời\",\"Send the reply\"),ct:L(\"sendMessage về đúng chat. Nếu người khác nhờ việc hoặc hỏi anh Đại, bot gửi riêng cho anh thêm '📩 Cần anh Đại xem'.\",\"sendMessage to the same chat. If someone else asks for something from you, the bot also DMs you '📩 needs your attention'.\")},\n  {id:\"c7\",lane:\"U\",d:1,after:\"c6\",ten:L(\"Anh nhận tin\",\"You get the answer\"),ct:L(\"Tin trả lời hiện trong Telegram.\",\"The answer shows up in Telegram.\")},\n  {id:\"c8\",lane:\"S\",d:1,after:\"c6\",gap:1.2,ten:L(\"Ghi lịch sử\",\"Save history\"),ct:L(\"Lưu cặp hỏi–đáp vào sổ 'hist' (giữ 800 dòng gần nhất) để lần sau còn nhớ mạch.\",\"Stores the Q&A pair in the 'hist' tab (last 800 rows) so the next turn keeps the thread.\")}\n ],\n ticks:function(Tm){return [0,1,2,3,4].map(function(s){return {t:s/4*Tm,v:s===0?\"0 s\":\"~\"+s+\" s\"};});},\n clock:function(cur,Tm){var s=cur/Tm*4;return \"~\"+s.toFixed(1).replace(\".\",\",\")+\" s\";}\n},\n{id:\"file\",ten:L(\"Gửi file → tải về PC\",\"Send a file → onto the PC\"),so:\"2\",dur:15,\n phu:L(\"Anh gửi file rồi dặn 'tải về' (kèm việc nếu muốn). Bot tải file về thư mục D:\\\\Telegram trên PC và ghi lại việc dặn; việc thật do Claude làm khi anh nhắn.\",\n       \"You send a file and say 'download it' (plus a task if you like). The bot lands the file in D:\\\\Telegram on the PC and logs the task; the real work is done by Claude when you ask.\"),\n tong:L(\"Từ lúc gửi tới khi file về PC\",\"From sending to the file on the PC\"),tongv:L(\"tối đa ≈ 3 phút\",\"at most ≈ 3 min\"),\n steps:[\n  {id:\"f1\",lane:\"U\",d:1,t0:0,ten:L(\"Anh gửi file\",\"You send a file\"),ct:L(\"Gửi hoặc forward file/ảnh/PDF. Bot Telegram chỉ tải được file ≤ 20MB.\",\"Send or forward a file/photo/PDF. A Telegram bot can only download files up to 20 MB.\")},\n  {id:\"f2\",lane:\"R\",d:.8,after:\"f1\",ten:L(\"Trạm chuyển\",\"Relay\"),ct:L(\"Chuyển tin sang Apps Script ở nền.\",\"Forwards the update to Apps Script in the background.\")},\n  {id:\"f3\",lane:\"B\",d:1.2,after:\"f2\",ten:L(\"Ghi hàng chờ\",\"Queue the file\"),ct:L(\"doPost thấy file: thêm một dòng vào sổ 'hang_cho', trạng thái 'cho'. CHƯA tải gì cả.\",\"doPost sees a file: adds a row to the 'hang_cho' tab with status 'cho'. Nothing is downloaded yet.\")},\n  {id:\"f4\",lane:\"S\",d:1,after:\"f3\",ten:L(\"Sổ hang_cho\",\"hang_cho tab\"),ct:L(\"File nằm trong hàng chờ, giữ 14 ngày.\",\"The file waits in the queue for 14 days.\")},\n  {id:\"f5\",lane:\"U\",d:1,after:\"f4\",gap:.8,ten:L(\"Anh dặn: tải về\",\"You say: download\"),ct:L(\"Ví dụ: 'tải 2 file này về PC, phân tích, viết báo cáo, gửi Outlook'. Chọn file: reply vào tin có file · nói 'N file' · mặc định là file gửi trong 30 phút gần nhất. Chỉ lệnh của anh Đại có tác dụng.\",\"E.g. 'download these 2 files to the PC, analyse, write a report, send via Outlook'. File choice: reply to the file message · say 'N files' · default = files from the last 30 min. Only your command counts.\")},\n  {id:\"f6\",lane:\"R\",d:.8,after:\"f5\",ten:L(\"Trạm chuyển\",\"Relay\"),ct:L(\"Chuyển tin sang Apps Script.\",\"Forwards the update.\")},\n  {id:\"f7\",lane:\"B\",d:1.4,after:\"f6\",ten:L(\"Nhận lệnh, chọn file\",\"Parse the order\"),ct:L(\"Đánh dấu các file đã chọn 'yeu_cau' (file quá 20MB bị từ chối và báo lại). Nếu lệnh có việc kèm (phân tích, báo cáo, gửi mail…) thì ghi vào sổ việc chờ.\",\"Marks the chosen files 'yeu_cau' (files over 20 MB are refused and reported). If the order carries a task (analyse, report, send mail…) it goes to the task log.\")},\n  {id:\"f8\",lane:\"G\",d:2.2,after:\"f7\",ai:1,ten:L(\"Gemini: 'tuân lệnh'\",\"Gemini: 'on it'\"),ct:L(\"Soạn câu trả lời dí dỏm kiểu 'tuân lệnh, em làm ngay'. Chỉ nhắc đúng người nhận anh đã nêu, không tự đoán.\",\"Writes a playful 'on it, boss' reply. It only echoes the recipient you named, never guesses one.\")},\n  {id:\"f9\",lane:\"S\",d:1.5,after:\"f7\",gap:1.2,ten:L(\"Ghi sổ việc chờ\",\"Log the task\"),ct:L(\"Tab 'viec_cho': lệnh gốc + tên file, trạng thái 'cho_claude'. Đây là sổ để Claude đọc khi anh nhờ.\",\"Tab 'viec_cho': the original order + file names, status 'cho_claude'. This is the to-do Claude reads when you ask.\")},\n  {id:\"f10\",lane:\"B\",d:1,after:\"f8\",ten:L(\"Trả lời anh\",\"Reply to you\"),ct:L(\"Gửi câu trả lời kèm danh sách file đã chọn.\",\"Sends the reply with the list of chosen files.\")},\n  {id:\"f11\",lane:\"B\",d:1.8,after:\"f10\",ten:L(\"Tải vào Drive (≤1′)\",\"Pull into Drive (≤1′)\"),ct:L(\"Trigger chạy mỗi phút: lấy file từ Telegram (getFile) và lưu vào một thư mục Drive riêng; trạng thái 'san_sang'.\",\"A trigger runs every minute: fetches the file from Telegram (getFile) and stores it in a private Drive folder; status 'san_sang'.\")},\n  {id:\"f12\",lane:\"S\",d:1.2,after:\"f11\",ten:L(\"Drive giữ file\",\"Drive holds the file\"),ct:L(\"File nằm trong Drive, chờ PC kéo về.\",\"The file sits in Drive, waiting for the PC.\")},\n  {id:\"f13w\",lane:\"P\",d:1.8,after:\"f12\",wait:1,ten:L(\"chờ Task Scheduler (≤2′)\",\"waiting for Task Scheduler (≤2′)\"),ct:L(\"PC công ty không nhận được Telegram trực tiếp (bị chặn), nên PC tự hỏi Sheet mỗi 2 phút xem có file 'san_sang' không.\",\"The work PC cannot reach Telegram (blocked), so it polls the Sheet every 2 minutes for files marked 'san_sang'.\")},\n  {id:\"f13\",lane:\"P\",d:1.6,after:\"f13w\",gap:0,ten:L(\"Lưu vào D:\\\\Telegram\",\"Save to D:\\\\Telegram\"),ct:L(\"Task Scheduler 'Telegram_Tu_Tai' kéo file từ Drive về thư mục D:\\\\Telegram (trùng tên thì thêm giờ vào đuôi, không đè file cũ). Không mở, không chạy file.\",\"Task Scheduler 'Telegram_Tu_Tai' pulls the file from Drive into D:\\\\Telegram (name clash → timestamp suffix, never overwrites). It never opens or runs the file.\")},\n  {id:\"f14\",lane:\"S\",d:1,after:\"f13\",ten:L(\"Ghi 'da_lay'\",\"Mark 'da_lay'\"),ct:L(\"PC báo đã lấy xong bằng cách ghi trạng thái 'da_lay' vào sổ.\",\"The PC reports done by writing status 'da_lay'.\")},\n  {id:\"f15\",lane:\"B\",d:1,after:\"f14\",ten:L(\"Trigger báo lại\",\"Trigger notifies\"),ct:L(\"Lần chạy kế tiếp của trigger thấy 'da_lay' thì nhắn Telegram cho anh.\",\"The next trigger run sees 'da_lay' and messages you on Telegram.\")},\n  {id:\"f16\",lane:\"U\",d:1,after:\"f15\",ten:L(\"✅ Đã về PC\",\"✅ On the PC\"),ct:L(\"Anh nhận tin '✅ Đã về PC: tên file (thư mục D:\\\\Telegram)'.\",\"You get '✅ Đã về PC: file name (folder D:\\\\Telegram)'.\")},\n  {id:\"f17\",lane:\"C\",d:2.4,after:\"f16\",gap:1.2,tay:1,ten:L(\"Claude làm việc thật\",\"Claude does the real work\"),ct:L(\"KHÔNG tự chạy. Khi anh nhắn Claude (remote control) 'xem việc chờ Telegram', Claude đọc sổ việc chờ, phân tích file, viết báo cáo và tạo THƯ NHÁP Outlook cho anh duyệt; không tự gửi.\",\"Never runs by itself. When you tell Claude (remote control) 'check the Telegram tasks', it reads the task log, analyses the file, writes the report and creates an Outlook DRAFT for you to review; it never sends.\")}\n ],\n links:[{a:\"f9\",b:\"f17\",lenh:1}],\n anchors:function(P){return [[0,0],[P.f10.t1,15],[P.f11.t1,60],[P.f12.t1,62],[P.f13.t1,180],[P.f16.t1,185],[P.T,185]];},\n ticks:function(Tm,P){return [{t:0,v:\"0:00\"},{t:P.f10.t1,v:\"0:15\"},{t:P.f11.t1,v:\"1:00\"},{t:P.f13.t1,v:\"3:00\"},{t:P.f16.t1,v:\"3:05\"}];},\n clock:function(cur,Tm,P,map){if(cur>=P.f17.t0)return NN===\"vi\"?\"khi anh ra lệnh\":\"when you ask\";var s=map(cur);return Math.floor(s/60)+\":\"+(\"0\"+Math.round(s%60)).slice(-2);}\n},\n{id:\"guard\",ten:L(\"Canh gác & dọn dẹp\",\"Watchdog & housekeeping\"),so:\"3\",dur:16,\n phu:L(\"Bot tự canh mình: cứ 10 phút soát webhook và nhật ký, lệch thì tự sửa và báo anh; mỗi 3 giờ sáng dọn sổ cũ. Trạm chuyển cũng tự báo khi làm rơi tin.\",\n       \"The bot watches itself: every 10 minutes it checks the webhook and its log, self-heals and alerts you; at 03:00 it prunes old rows. The relay also alerts you if it drops a message.\"),\n tong:L(\"Chu kỳ canh gác\",\"Watchdog cycle\"),tongv:L(\"mỗi 10 phút\",\"every 10 min\"),\n steps:[\n  {id:\"g1\",lane:\"B\",d:1.6,t0:0,ten:L(\"Canh gác (mỗi 10′)\",\"Watchdog (10′)\"),ct:L(\"Trigger canhGac chạy mỗi 10 phút.\",\"The canhGac trigger runs every 10 minutes.\")},\n  {id:\"g2\",lane:\"U\",d:1.6,after:\"g1\",ten:L(\"Hỏi Telegram\",\"Ask Telegram\"),ct:L(\"getWebhookInfo: địa chỉ webhook còn đúng không, Telegram có báo lỗi giao tin không, có từ 3 tin trở lên bị kẹt không.\",\"getWebhookInfo: is the webhook address still right, did Telegram report delivery errors, are 3+ updates stuck?\")},\n  {id:\"g3\",lane:\"B\",d:1.6,after:\"g2\",ten:L(\"Lệch? tự sửa\",\"Drift? self-heal\"),ct:L(\"Webhook lệch thì tự đặt lại về trạm chuyển. Đồng thời soát nhật ký 15 phút gần nhất xem bot có gặp lỗi xử lý không.\",\"If the webhook KIỂM\",\"READ & CHECK\"),s:L(\"ngày · giờ · task · %\",\"date · time · task · %\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Kiểm ngày, giờ (Đến phải sau Từ), việc, % trong 0–100, tên task có đúng Danh mục không. Dòng nào có !! thì DỪNG và hỏi anh (ô đỏ phía trên), chưa ghi gì. Thà báo lỗi còn hơn đoán.\",\"Checks date, times (To after From), work, % in 0–100 and task names against the catalogue. A row marked !! STOPS and asks you (the red box above), nothing is written. Better to flag than to guess.\"),\n   sh:L(\"Kiểm ngày, giờ, % và tên task; dòng có !! thì dừng và hỏi anh, chưa ghi gì.\",\"Checks date, time, % and task names; a row marked !! stops and asks you, nothing is written.\")},\n  {id:\"d4\",g:\"g1\",k:\"ai\",i:\"k-ai\",c:3,r:0,t:L(\"DỰNG SPEC\",\"BUILD SPEC\"),s:L(\"Claude điền nhóm, kết quả\",\"Claude fills group, result\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Dựng khung spec: các dòng giờ làm, nội dung từng task Sheet (việc cùng task gộp bằng «; »), trạng thái/% của task. Claude chỉ điền nhóm việc, đầu mối, kết quả; KHÔNG tự đổi task, giờ, %.\",\"Builds the spec skeleton: time rows, each Sheet task's text (same-task work joined with «; »), status/% per task. Claude only fills group, counterpart and result, never tasks, times or %.\"),\n   sh:L(\"Dựng spec: Claude chỉ điền nhóm việc, đầu mối, kết quả; không tự đổi task, giờ, %.\",\"Builds the spec: Claude only fills group, counterpart, result; never tasks, times or %.\")},\n  {id:\"k5\",g:\"g1\",i:\"k-shield\",c:4,r:0,t:L(\"KIỂM TRƯỚC\",\"PRE-CHECK\"),s:L(\"dry-run · file không khoá\",\"dry run · file not locked\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"In kế hoạch Google Sheet (dry-run) và kiểm file Excel nhật ký không bị khóa (đang mở thì dừng, nhờ anh đóng). Mọi thứ ổn thì HAI NHÁNH bên dưới được chạy SONG SONG: chúng không dùng chung file nào.\",\"Prints the Google Sheet plan (dry run) and checks the diary Excel is not locked (if open it stops and asks you to close it). When all is fine the TWO BRANCHES below run IN PARALLEL: they share no file.\"),\n   sh:L(\"Dry-run kế hoạch Google Sheet, kiểm file Excel không bị khoá; ổn thì 2 nhánh dưới chạy SONG SONG.\",\"Dry-runs the Google Sheet plan and checks Excel is not locked; if fine the 2 branches below run IN PARALLEL.\")},\n  {id:\"a1\",g:\"g5\",i:\"k-stack\",c:4,r:1,t:L(\"GHI EXCEL NHẬT KÝ\",\"WRITE DIARY EXCEL\"),s:L(\"sao lưu · ghi giờ · 11 Task\",\"backup · hours · 11 tasks\"),gio:L(\"EXCEL\",\"EXCEL\"),\n   ct:L(\"Sao lưu vào _backup rồi ghi các dòng giờ làm vào Nhat ky cong viec_v2.xlsx, Excel tính lại. Đây là số liệu THỐNG KÊ GIỜ theo 11 Task lớn của dashboard. Nhánh này chạy song song với nhánh Google Sheet.\",\"Backs up to _backup, then writes the time rows into Nhat ky cong viec_v2.xlsx and recalculates. This is the HOUR statistics by the dashboard's 11 big tasks. Runs in parallel with the Google Sheet branch.\"),\n   sh:L(\"Sao lưu rồi ghi giờ làm vào Excel nhật ký, tính lại thống kê theo 11 Task lớn.\",\"Backs up, writes the time rows into the diary Excel and recalculates the 11-task statistics.\")},\n  {id:\"a2\",g:\"g5\",i:\"k-cloud\",c:3,r:1,t:L(\"ĐẨY LÊN WEB\",\"PUBLISH\"),s:L(\"dựng HTML · Cloudflare\",\"build HTML · Cloudflare\"),gio:L(\"DASHBOARD\",\"WEB\"),\n   ct:L(\"Dựng lại dashboard nhật ký và đẩy lên GitHub; Cloudflare Pages tự build ngầm (≈ 1 phút) tại nhat-ky-cong-viec.pages.dev. Nhánh này không cần chờ Google Sheet.\",\"Rebuilds the diary dashboard and pushes to GitHub; Cloudflare Pages builds in the background (≈ 1 min) at nhat-ky-cong-viec.pages.dev. This branch does not wait for the Google Sheet.\"),\n   sh:L(\"Dựng lại dashboard, đẩy lên GitHub; Cloudflare tự build ngầm (≈ 1 phút), không chờ Google Sheet.\",\"Rebuilds the dashboard and pushes it; Cloudflare builds in the background (≈ 1 min), no wait for the Sheet.\")},\n  {id:\"a3\",g:\"g5\",i:\"k-globe\",c:2,r:1,t:L(\"SO SHA WEB\",\"COMPARE LIVE SHA\"),s:L(\"trang thật khớp bản dựng\",\"live page = built page\"),gio:L(\"DASHBOARD\",\"WEB\"),\n   ct:L(\"Chờ Cloudflare build xong rồi so mã SHA của trang thật nhat-ky-cong-viec.pages.dev với bản vừa dựng; chưa khớp thì deploy lại một lần.\",\"Waits for Cloudflare, then compares the SHA of the live page with the one just built; if different it redeploys once.\"),\n   sh:L(\"So SHA trang web thật với bản vừa dựng; chưa khớp thì deploy lại một lần.\",\"Compares the live page SHA with the build; if different it redeploys once.\")},\n  {id:\"b1\",g:\"g4\",i:\"k-merge\",c:4,r:2,t:L(\"ÁP THAY ĐỔI\",\"APPLY CHANGES\"),s:L(\"ô ngày · trạng thái · %\",\"day cell · status · %\"),gio:L(\"EXCEL\",\"EXCEL\"),\n   ct:L(\"Chụp tab T<tháng> của Google Sheet về Excel trung gian, tìm đúng dòng PIC Daicd theo Mảng, đặt ô ngày + trạng thái + %, rồi vẽ lại file Excel đẹp Daily_tracking. Task mới (nếu anh chỉ rõ) vào dòng trống đầu tiên.\",\"Snapshots the month tab into an intermediate Excel, finds the PIC Daicd row by task, sets day cell + status + %, then redraws the nice Daily_tracking Excel. A new task (only if you name it) goes into the first empty row.\"),\n   sh:L(\"Chụp tab Sheet về Excel trung gian, tìm dòng PIC Daicd, đặt ô ngày + trạng thái + %, vẽ lại Excel đẹp.\",\"Snapshots the tab, finds the PIC Daicd row, sets day + status + %, redraws the nice Excel.\")},\n  {id:\"b2\",g:\"g4\",i:\"k-db\",c:3,r:2,t:L(\"GHI GOOGLE SHEET\",\"WRITE GOOGLE SHEET\"),s:L(\"không ghi đè ô có sẵn\",\"never overwrites cells\"),gio:L(\"SHEET\",\"SHEET\"),\n   ct:L(\"Đẩy các ô đã đổi lên [QTRR]_Daily tracking, ghi nguyên văn. Ô đã có nội dung khác thì KHÔNG ghi đè, báo lại. Proxy công ty chập chờn thì tự thử lại vài lần; vẫn hỏng thì báo thẳng bước này lỗi (Excel + web đã xong) và chạy lại với --tiep-tuc.\",\"Pushes the changed cells to [QTRR]_Daily tracking, raw. A cell with other text is NOT overwritten, it is reported. If the company proxy flakes it retries a few times; if it still fails the report names this step (Excel + web are done) and the run resumes with --tiep-tuc.\"),\n   sh:L(\"Đẩy các ô lên Google Sheet, không ghi đè ô có chữ khác; mạng chập chờn thì tự thử lại.\",\"Pushes the cells to Google Sheet without overwriting other text; retries on a flaky network.\")},\n  {id:\"b3\",g:\"g4\",i:\"k-eye\",c:2,r:2,t:L(\"ĐỐI CHIẾU\",\"READ BACK\"),s:L(\"đọc lại từng ô vừa ghi\",\"re-read every written cell\"),gio:L(\"SHEET\",\"SHEET\"),\n   ct:L(\"Đọc lại từng ô vừa ghi và so với mong đợi. Lệch bất kỳ ô nào là báo LECH và thoát mã 4.\",\"Re-reads every written cell and compares it with the expectation. Any mismatch is reported as LECH and exits with code 4.\"),\n   sh:L(\"Đọc lại từng ô vừa ghi và so với mong đợi; lệch ô nào là báo LECH và dừng (mã 4).\",\"Reads every written cell back and compares; any mismatch is reported as LECH and stops (code 4).\")},\n  {id:\"b4\",g:\"g2\",i:\"k-clean\",c:1,r:2,t:L(\"ÉP ĐỊNH DẠNG\",\"FORCE FORMAT\"),s:L(\"wrap · giữa · TNR 12\",\"wrap · centred · TNR 12\"),gio:L(\"ĐỊNH DẠNG\",\"FORMAT\"),\n   ct:L(\"MỌI ô của MỌI dòng PIC Daicd (cột A → cuối, các tab T8–T12): wrap 100%, căn giữa ngang + dọc, Times New Roman cỡ 12. Dòng người khác, tiêu đề, định dạng số/ngày không đụng tới. Không chỉ ô vừa ghi (lỗi ngày 12/10: 555 ô lệch).\",\"EVERY cell of EVERY PIC Daicd row (column A → end, tabs T8–T12): 100% wrap, centred both ways, Times New Roman 12. Other people's rows, headers and number/date formats are untouched. Not only the cells just written (12 Oct bug: 555 cells off).\"),\n   sh:L(\"Ép MỌI ô dòng PIC Daicd: wrap 100%, căn giữa ngang + dọc, Times New Roman 12.\",\"Forces EVERY PIC Daicd cell: 100% wrap, centred both ways, Times New Roman 12.\")},\n  {id:\"b5\",g:\"g2\",i:\"k-target\",c:0,r:2,t:L(\"KIỂM ĐẠT 100%\",\"CHECK 100%\"),s:L(\"còn lệch thì báo, không bỏ\",\"leftovers are reported\"),gio:L(\"ĐỊNH DẠNG\",\"FORMAT\"),\n   ct:L(\"Duyệt lại từng ô PIC Daicd. Đạt 100% mới qua; còn lệch thì thoát mã 4 và báo anh số ô lệch. Báo cáo cuối ngày LUÔN nêu kết quả bước này.\",\"Re-checks every PIC Daicd cell. Only 100% passes; leftovers exit with code 4 and the count is reported. The daily report ALWAYS states this result.\"),\n   sh:L(\"Duyệt lại từng ô; đạt 100% mới qua, còn lệch thì báo số ô lệch cho anh.\",\"Re-checks every cell; only 100% passes, any leftover is reported with its count.\")},\n  {id:\"j\",g:\"g2\",k:\"ai\",i:\"k-send\",c:0,r:1,t:L(\"CHỐT & BÁO CÁO\",\"CLOSE & REPORT\"),s:L(\"cả 2 nhánh xong · đánh ✔\",\"both done · tick ✔\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Khi CẢ HAI nhánh xong và thành công mới đánh ✔ vào file nhập. Rồi báo anh: số dòng, giờ, ô Google Sheet đã ghi, % mới, kết quả định dạng «ĐẠT 100%», trang web đã khớp chưa và mọi giả định đã tự xếp để anh sửa.\",\"Only when BOTH branches have finished successfully is the input file ticked ✔. Then it reports: rows, hours, Sheet cells written, new %, the format result «100% PASS», whether the web page matches and every assumption made so you can correct it.\"),\n   sh:L(\"Cả 2 nhánh xong và thành công mới đánh ✔ vào file nhập, rồi báo anh kết quả từng nhánh.\",\"Only when both branches succeed is the input file ticked ✔, then it reports each branch.\")},\n  {id:\"abt\",g:\"gx\",k:\"lun\",i:\"k-stop\",c:2,y:14,w:300,h:50,t:L(\"DỪNG & HỎI ANH\",\"STOP & ASK YOU\"),s:L(\"\",\"\"),gio:L(\"\",\"\"),\n   ct:L(\"Gặp sự cố là dừng đúng chỗ, không ghi dở: dòng sai (!!) thì hỏi anh sửa; file Excel đang mở thì nhờ anh đóng (thoát mã 5); Google lỗi token/mạng thì báo «Excel + web đã xong, chỉ Sheet lỗi» và chạy lại với --tiep-tuc. Chưa xong thì KHÔNG đánh ✔ vào file nhập.\",\"On trouble it stops at the right place with no half writes: a bad row (!!) → you fix it; Excel open → asks you to close it (exit 5); Google token/network error → «Excel + web done, only the Sheet failed» and a rerun with --tiep-tuc. Until it is done nothing is ticked ✔.\"),\n   sh:L(\"Sự cố là dừng đúng chỗ: dòng sai thì hỏi anh, file mở thì nhờ đóng, Google lỗi thì chạy lại --tiep-tuc.\",\"Trouble stops at the right place: bad row → ask you, file open → close it, Google error → rerun --tiep-tuc.\")}\n ],\n steps:[[\"d1\"],[\"d2\"],[\"d3\"],[\"d4\"],[\"k5\"],[\"a1\",\"b1\"],[\"a2\",\"b2\"],[\"a3\",\"b3\"],[\"b4\"],[\"b5\"],[\"j\"]],\n stepTxt:{5:L(\"Hai nhánh chạy SONG SONG: ghi Excel nhật ký (thống kê giờ) và áp thay đổi lên Google Sheet; không dùng chung file nào.\",\"Two branches run IN PARALLEL: write the diary Excel (hours) and apply the changes for the Google Sheet; no shared file.\"),\n          6:L(\"Song song: đẩy dashboard lên web (Cloudflare build ngầm) và ghi lên Google Sheet.\",\"In parallel: publish the dashboard (Cloudflare builds in the background) and write to the Google Sheet.\"),\n          7:L(\"Song song: so SHA trang web thật và đọc lại từng ô Google Sheet để đối chiếu.\",\"In parallel: compare the live web SHA and read every Google Sheet cell back.\")},\n abortOn:[\"d3\",\"k5\",\"b2\"],\n pos:function(n){if(n.id===\"abt\")return [X0(2)-25,14];return [X0(n.c),[130,345,560][n.r]];},\n W:250,H:92,\n edges:[{f:\"d1\",t:\"d2\",m:\"rl\",c:\"g1\"},{f:\"d2\",t:\"d3\",m:\"rl\",c:\"g1\"},{f:\"d3\",t:\"d4\",m:\"rl\",c:\"g1\"},{f:\"d4\",t:\"k5\",m:\"rl\",c:\"g1\"},\n        {f:\"k5\",t:\"a1\",m:\"tb\",c:\"g1\"},{f:\"k5\",t:\"b1\",m:\"rr\",c:\"g1\"},\n        {f:\"a1\",t:\"a2\",m:\"lr\",c:\"g5\"},{f:\"a2\",t:\"a3\",m:\"lr\",c:\"g5\"},{f:\"a3\",t:\"j\",m:\"lr\",c:\"g5\"},\n        {f:\"b1\",t:\"b2\",m:\"lr\",c:\"g4\"},{f:\"b2\",t:\"b3\",m:\"lr\",c:\"g4\"},{f:\"b3\",t:\"b4\",m:\"lr\",c:\"g4\"},{f:\"b4\",t:\"b5\",m:\"lr\",c:\"g2\"},{f:\"b5\",t:\"j\",m:\"len\",c:\"g2\"},\n        {f:\"d3\",t:\"abt\",m:\"len\",c:\"gx\",dash:1},{f:\"b2\",t:\"b2\",m:\"vong\",c:\"g4\"}],\n groups:[\n  {ids:[\"d1\",\"d2\",\"d3\",\"d4\",\"k5\"],g:\"g1\",t:L(\"01 · NHẬP VIỆC & KIỂM\",\"01 · ENTER & CHECK\")},\n  {ids:[\"a1\",\"a2\",\"a3\"],g:\"g5\",t:L(\"02A · THỐNG KÊ GIỜ → WEB\",\"02A · HOURS → WEB\")},\n  {ids:[\"b1\",\"b2\",\"b3\",\"b4\",\"b5\"],g:\"g4\",at:\"b4\",t:L(\"02B · GOOGLE SHEET & CHUẨN ĐỊNH DẠNG\",\"02B · GOOGLE SHEET & STANDARD FORMAT\")},\n  {ids:[\"j\"],g:\"g2\",t:L(\"03 · CHỐT\",\"03 · CLOSE\")}\n ],\n labels:[\n  {neo:\"k5\",dx:109,dy:158,anchor:\"end\",g:\"g1\",t:L(\"⇊ 2 nhánh chạy SONG SONG\",\"⇊ 2 branches run IN PARALLEL\")},\n  {neo:\"b2\",dx:196,dy:-22,anchor:\"start\",g:\"g4\",t:L(\"↻ tự thử lại khi mạng chập chờn\",\"↻ auto-retry on flaky network\")},\n  {neo:\"abt\",dx:-14,dy:32,anchor:\"end\",g:\"gx\",t:L(\"dòng sai · file đang mở · Google lỗi\",\"bad row · file open · Google error\")}\n ]\n};\nfunction SHORT_APPLY(){for(var k in SHORT_NEW)SHORT[k]=SHORT_NEW[k];[CT,OL,SL].forEach(function(M){M.nodes.forEach(function(n){if(n.sh)SHORT[n.id]=n.sh;});});}\nfunction X0(c){return 40+c*320;}\nvar OL={ /* OUTLOOK: mail báo cáo tự động + mail ad hoc, kích hoạt bằng lịch hoặc remote control */\n view:[0,0,1930,440],\n nodes:[\n  {id:\"e1\",g:\"g1\",i:\"k-clock\",c:0,y:130,t:L(\"LỊCH 7H TỰ ĐỘNG\",\"7AM SCHEDULE\"),s:L(\"xong luồng 7h → gửi\",\"after the 7am run → send\"),gio:L(\"LỊCH\",\"SCHEDULE\"),\n   ct:L(\"Cuối luồng 7h (sau khi AI Detection xong, khoảng 7:35–7:45) hệ thống tự gửi mail báo cáo dashboard cho chị Nhan và chị Nhung; mỗi người tối đa 1 mail/ngày nhờ dấu chống trùng.\",\"At the end of the 7am run (after AI Detection, about 7:35–7:45) the system sends the dashboard report to chị Nhan and chị Nhung; at most one mail per person per day thanks to a de-dup mark.\")},\n  {id:\"e2\",g:\"g1\",i:\"k-screen\",c:0,y:290,t:L(\"ANH ĐẠI REMOTE\",\"YOU · REMOTE\"),s:L(\"gửi lại · gửi ad hoc\",\"resend · ad hoc\"),gio:L(\"ANH ĐẠI\",\"YOU\"),\n   ct:L(\"Anh dặn Claude qua remote control: «gửi lại mail báo cáo hôm nay» hoặc một mail ad hoc (gửi ai, đính file nào, nói gì). Claude chạy ngay trên PC công ty, không cần anh ngồi máy.\",\"You tell Claude through remote control: «resend today's report» or an ad hoc mail (to whom, which file, what to say). Claude runs right on the work PC; you do not need to be at the desk.\")},\n  {id:\"soan\",g:\"g5\",k:\"ai\",i:\"k-ai\",c:1,y:210,t:L(\"SOẠN NỘI DUNG\",\"WRITE THE MAIL\"),s:L(\"theo người nhận\",\"tuned to the reader\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Báo cáo 7h: lấy số liệu của lượt chạy. Mail ad hoc: soạn theo lời anh dặn. Văn phong theo người nhận: gửi chị Nhan (cấp trên) mở «Dear chị Nhan,» và kết «Trân trọng!»; ngắn, không lan man.\",\"The 7am report uses that run's figures; an ad hoc mail follows what you said. Tone follows the reader: to chị Nhan (senior) it opens «Dear chị Nhan,» and closes «Trân trọng!»; short, no rambling.\")},\n  {id:\"dung\",g:\"g5\",i:\"k-mail\",c:2,y:210,t:L(\"DỰNG MAIL\",\"BUILD THE MAIL\"),s:L(\"chữ ký · TNR 12\",\"signature · TNR 12\"),gio:L(\"OUTLOOK\",\"OUTLOOK\"),\n   ct:L(\"Tạo thư trong hộp daicd\\\\Drafts bằng Outlook (COM), để Outlook tự chèn chữ ký mặc định, rồi chèn nội dung Times New Roman 12pt đen ngay trên chữ ký. Không dùng .Body trần vì mất chữ ký.\",\"Creates the item in daicd\\\\Drafts through Outlook (COM), lets Outlook insert the default signature, then inserts the Times New Roman 12pt black body above it. Never a bare .Body, which loses the signature.\")},\n  {id:\"gui\",g:\"g4\",i:\"k-send\",c:3,y:130,t:L(\"GỬI VÀO LUỒNG\",\"SEND IN THREAD\"),s:L(\"reply cùng luồng\",\"reply in one thread\"),gio:L(\"OUTLOOK\",\"OUTLOOK\"),\n   ct:L(\"Mail báo cáo định kỳ đã duyệt mẫu: Reply vào đúng luồng «Luồng báo cáo dashboard hằng ngày» của từng chị rồi gửi; chưa có luồng thì gửi mail gốc.\",\"The approved recurring report: Reply inside each person's thread «Luồng báo cáo dashboard hằng ngày» and send; with no thread yet it sends the first mail.\")},\n  {id:\"nhap\",g:\"g4\",i:\"k-eye\",c:3,y:290,t:L(\"NHÁP ĐỂ DUYỆT\",\"DRAFT TO REVIEW\"),s:L(\"ad hoc · mẫu mới\",\"ad hoc · new template\"),gio:L(\"ANH ĐẠI\",\"YOU\"),\n   ct:L(\"Mail ad hoc, mẫu mới hoặc gửi người mới thì chỉ lưu NHÁP và chụp ảnh cho anh xem; anh bảo «gửi đi» (hoặc tự bấm Send) rồi mới gửi.\",\"An ad hoc mail, a new template or a new recipient is only saved as a DRAFT with a screenshot for you; it goes out only after you say «send it» (or press Send yourself).\")},\n  {id:\"kiem\",g:\"g2\",i:\"k-shield\",c:4,y:210,t:L(\"KIỂM SENT\",\"VERIFY SENT\"),s:L(\"Sent · Outbox = 0\",\"Sent · Outbox = 0\"),gio:L(\"OUTLOOK\",\"OUTLOOK\"),\n   ct:L(\"Dò đúng hộp daicd: thư nằm ở Sent Items, Outbox = 0, đúng người nhận, đúng file đính kèm. Kiểm xong mới báo anh «đã gửi», không báo khi chưa kiểm.\",\"Checks the right mailbox: the item is in Sent Items, Outbox = 0, right recipients, right attachments. Only then does it tell you «sent».\")},\n  {id:\"nhan\",g:\"g2\",i:\"k-globe\",c:5,y:210,t:L(\"NGƯỜI NHẬN\",\"RECIPIENTS\"),s:L(\"chị Nhan · chị Nhung\",\"chị Nhan · chị Nhung\"),gio:L(\"NHẬN MAIL\",\"RECEIVE\"),\n   ct:L(\"Chị Nhan nhận bản cấp trên (I. Tóm tắt · II. Điểm cần lưu ý · III. Chi tiết), chị Nhung nhận bản đồng nghiệp. Mail ad hoc tới đúng người anh chỉ định, không cc nếu anh không nói.\",\"Chị Nhan gets the senior version (I. Summary · II. Points to note · III. Detail), chị Nhung the colleague version. An ad hoc mail goes only to whom you name, no cc unless you say so.\")},\n  {id:\"oabt\",g:\"gx\",k:\"lun\",i:\"k-stop\",c:2,y:14,w:300,h:50,t:L(\"DỪNG · KHÔNG GỬI TRẦN\",\"STOP · NEVER SEND BARE\"),s:L(\"\",\"\"),gio:L(\"\",\"\"),\n   ct:L(\"Sai font, không thấy chữ ký (chuỗi «Keangnam»), sai người nhận hoặc không bám được Outlook thì DỪNG, đóng nháp và báo anh. Không bao giờ gửi mail thiếu chữ ký; mail đã đi thì không thu hồi được.\",\"Wrong font, no signature found (the «Keangnam» text), wrong recipient or no Outlook binding: STOP, close the draft and tell you. Never send without the signature; a sent mail cannot be recalled.\")}\n ],\n steps:[[\"e1\",\"e2\"],[\"soan\"],[\"dung\"],[\"gui\",\"nhap\"],[\"kiem\"],[\"nhan\"]],\n stepTxt:{0:L(\"Hai cách khởi động: lịch tự động sau luồng 7h, hoặc anh nhắn Claude qua remote control (gửi lại / ad hoc).\",\"Two ways to start: the automatic schedule after the 7am run, or you message Claude by remote control (resend / ad hoc).\"),\n          3:L(\"Tuỳ loại mail: báo cáo định kỳ → reply vào luồng và gửi; ad hoc / mẫu mới → lưu nháp để anh duyệt.\",\"Depends on the mail: recurring report → reply in the thread and send; ad hoc / new template → save a draft for your review.\")},\n abortOn:[\"dung\"],\n pos:function(n){return [X0(n.c)+(n.id===\"oabt\"?-25:0),n.y];},\n W:250,H:92,\n edges:[{f:\"e1\",t:\"soan\",m:\"rl\",c:\"g1\"},{f:\"e2\",t:\"soan\",m:\"rl\",c:\"g1\"},{f:\"soan\",t:\"dung\",m:\"rl\",c:\"g5\"},{f:\"dung\",t:\"gui\",m:\"rl\",c:\"g4\"},{f:\"dung\",t:\"nhap\",m:\"rl\",c:\"g4\"},\n        {f:\"gui\",t:\"kiem\",m:\"rl\",c:\"g4\"},{f:\"nhap\",t:\"kiem\",m:\"rl\",c:\"g4\"},{f:\"kiem\",t:\"nhan\",m:\"rl\",c:\"g2\"},{f:\"dung\",t:\"oabt\",m:\"len\",c:\"gx\",dash:1}],\n groups:[\n  {ids:[\"e1\",\"e2\"],g:\"g1\",t:L(\"01 · KHỞI ĐỘNG (2 CÁCH)\",\"01 · START (2 WAYS)\")},\n  {ids:[\"soan\",\"dung\"],g:\"g5\",t:L(\"02 · SOẠN & DỰNG MAIL\",\"02 · WRITE & BUILD\")},\n  {ids:[\"gui\",\"nhap\"],g:\"g4\",t:L(\"03 · GỬI HOẶC DUYỆT\",\"03 · SEND OR REVIEW\")},\n  {ids:[\"kiem\",\"nhan\"],g:\"g2\",t:L(\"04 · KIỂM & CHỐT\",\"04 · VERIFY & CLOSE\")}\n ],\n labels:[\n  {neo:\"nhap\",dx:125,dy:118,giua:1,g:\"g4\",t:L(\"anh xem bản nháp, duyệt rồi mới gửi\",\"you review the draft before it goes\")},\n  {neo:\"oabt\",dx:-14,dy:32,anchor:\"end\",g:\"gx\",t:L(\"sai font · thiếu chữ ký · sai người nhận\",\"wrong font · no signature · wrong recipient\")}\n ]\n};\nvar SL={ /* SLIDE: yêu cầu về → (hỏi anh mục tiêu ‖ Claude đọc nguồn) → mạch lập luận → anh chốt text → dựng → soát → anh góp ý → vá */\n view:[0,0,1640,610],\n nodes:[\n  {id:\"s1\",g:\"g1\",i:\"k-target\",c:0,y:130,t:L(\"MỤC TIÊU\",\"GOAL\"),s:L(\"hỏi anh · cho ai, dài sao\",\"ask you · for whom, how long\"),gio:L(\"ANH ĐẠI\",\"YOU\"),\n   ct:L(\"Hỏi anh: mục tiêu thuyết phục điều gì, người xem là ai (lãnh đạo hay kỹ thuật), dài bao nhiêu slide, câu sếp chắc chắn sẽ hỏi, và file nguồn nào là chính. Hỏi gộp một lượt, chốt bằng lựa chọn, không tự đoán. Việc này chạy SONG SONG với việc Claude đọc nguồn.\",\"Asks you: what the deck must persuade, who watches (leaders or engineers), how long, the question the boss will surely ask, and which file is the main source. All asked in one go, settled by choices, never guessed. Runs IN PARALLEL with Claude reading the sources.\"),\n   sh:L(\"Hỏi gộp một lượt: thuyết phục gì, người xem là ai, dài bao nhiêu, câu sếp sẽ hỏi, file nguồn chính.\",\"One round of questions: what to persuade, who watches, length, the boss's question, the main source file.\")},\n  {id:\"s2\",g:\"g1\",i:\"k-layers\",c:0,y:290,t:L(\"ĐỌC NGUỒN\",\"READ SOURCES\"),s:L(\"chỉ đọc · nhiều file cùng lúc\",\"read-only · many files at once\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Ngay khi nhận yêu cầu, Claude đọc các file nguồn đã nêu ở chế độ chỉ đọc (xlsx, pptx, pdf), nhiều file cùng một lúc, không cần chờ anh trả lời. Gặp mâu thuẫn giữa các nguồn thì báo ngay; chỗ chưa có thông tin ghi rõ «Chưa có thông tin», không viết bừa.\",\"As soon as the request arrives Claude reads the named source files read-only (xlsx, pptx, pdf), several at once, without waiting for your answers. A conflict between sources is reported at once; missing facts are marked «No information yet», never invented.\"),\n   sh:L(\"Đọc nguồn chỉ-đọc ngay khi nhận yêu cầu, nhiều file cùng lúc; mâu thuẫn thì báo, thiếu thì ghi «Chưa có thông tin».\",\"Reads sources read-only right away, several files at once; conflicts reported, gaps marked «No information yet».\")},\n  {id:\"s3\",g:\"g1\",k:\"ai\",i:\"k-ai\",c:1,y:210,t:L(\"MẠCH LẬP LUẬN\",\"ARGUMENT FLOW\"),s:L(\"cần CẢ mục tiêu lẫn dữ kiện\",\"needs both goal and facts\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Nối hai nhánh lại: có mục tiêu và người xem (từ anh) cùng dữ kiện (từ nguồn) mới dựng được mạch câu hỏi sếp đi qua: cần hệ thống thế nào → cái cũ không đạt → cái mới đạt → có duy trì được không → quy mô → lộ trình → kiến nghị.\",\"Joins the two branches: with the goal and audience (from you) and the facts (from the sources) it builds the boss's chain of questions: what is needed → the old one fails → the new one passes → can it be sustained → scale → roadmap → recommendation.\"),\n   sh:L(\"Có CẢ mục tiêu lẫn dữ kiện mới dựng mạch: cần gì → cái cũ không đạt → cái mới đạt → duy trì → quy mô → lộ trình.\",\"Needs BOTH goal and facts to build the chain: need → old fails → new passes → sustain → scale → roadmap.\")},\n  {id:\"s4\",g:\"g1\",i:\"k-pen\",c:2,y:210,t:L(\"OUTLINE BẰNG TEXT\",\"TEXT OUTLINE\"),s:L(\"anh «chốt» mới dựng file\",\"build only after you OK\"),gio:L(\"ANH ĐẠI CHỐT\",\"YOU APPROVE\"),\n   ct:L(\"Viết nội dung từng slide bằng text: nhãn, tiêu đề là một câu thông điệp, nội dung, hình dự kiến, nguồn; đánh dấu ⚠ chỗ cần anh xác nhận. CHƯA có chữ «chốt» thì chưa đụng tới file.\",\"Writes each slide as text: label, a one-sentence title, content, planned visual, source; ⚠ marks what needs your confirmation. Until you say «approved» no file is touched.\"),\n   sh:L(\"Viết từng slide bằng text, đánh dấu ⚠ chỗ cần xác nhận; anh nói «chốt» thì mới dựng file.\",\"Writes each slide as text with ⚠ for open points; the file is built only after you say «approved».\")},\n  {id:\"s5\",g:\"g5\",k:\"ai\",i:\"k-slide\",c:3,y:210,t:L(\"DỰNG FILE\",\"BUILD THE FILE\"),s:L(\"python-pptx · phông cố định\",\"python-pptx · fixed fonts\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Dựng .pptx bằng thư viện có sẵn: 16:9, phông Bahnschrift + Segoe UI, nền F5F6FB, đỏ EE0032, logo góc phải. Bố cục tự nghĩ, không chép mẫu; mỗi lần xuất là một file mới (_v2, _v3…), không ghi đè.\",\"Builds the .pptx with the existing library: 16:9, Bahnschrift + Segoe UI, background F5F6FB, red EE0032, logo top right. Layouts are designed, not copied; every export is a new file (_v2, _v3…), never an overwrite.\"),\n   sh:L(\"Dựng .pptx 16:9, phông Bahnschrift + Segoe UI, bố cục tự nghĩ; mỗi lần xuất là file mới (_v2, _v3…).\",\"Builds a 16:9 .pptx, Bahnschrift + Segoe UI, designed layouts; every export is a new file (_v2, _v3…).\")},\n  {id:\"s6\",g:\"g5\",i:\"k-radar\",c:4,y:210,t:L(\"RENDER SOÁT\",\"RENDER & CHECK\"),s:L(\"ảnh từng trang · tràn, đè\",\"page images · overflow\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Xuất ảnh từng trang rồi soát chữ tràn/chạm viền, nhãn đè nhau, khoảng trống lớn, dòng bị giãn chữ. Sai thì sửa rồi render lại, đạt mới đưa anh.\",\"Renders every page to an image and checks overflow, labels colliding, big gaps and stretched lines. Fix and render again; only a clean deck reaches you.\"),\n   sh:L(\"Xuất ảnh từng trang, soát chữ tràn, nhãn đè, khoảng trống; sửa tới khi sạch mới đưa anh.\",\"Renders each page, checks overflow, colliding labels, gaps; fixes until clean before showing you.\")},\n  {id:\"s7\",g:\"g5\",i:\"k-eye\",c:4,y:430,t:L(\"ANH XEM & GÓP Ý\",\"YOU REVIEW\"),s:L(\"gom góp ý A–Z một lượt\",\"all feedback in one pass\"),gio:L(\"ANH ĐẠI\",\"YOU\"),\n   ct:L(\"Anh xem và gom góp ý từ A đến Z một lượt cho đỡ dựng lại nhiều lần; ý chưa rõ thì Claude hỏi lại hoặc đề xuất một hướng.\",\"You review and collect feedback A to Z in one pass to avoid many rebuilds; if a point is unclear Claude asks or proposes one direction.\"),\n   sh:L(\"Anh xem và gom góp ý A–Z một lượt cho đỡ dựng lại nhiều lần.\",\"You review and gather feedback A–Z in one pass to avoid repeated rebuilds.\")},\n  {id:\"s8\",g:\"g5\",i:\"k-clean\",c:3,y:430,t:L(\"VÁ THEO FEEDBACK\",\"PATCH THE FEEDBACK\"),s:L(\"chỉ sửa slide anh nêu\",\"only the slides you name\"),gio:L(\"CLAUDE\",\"CLAUDE\"),\n   ct:L(\"Lấy file mới nhất trong thư mục làm nền (anh có thể đã sửa tay), chỉ vá slide được nêu, chạy diff để chắc không đụng slide khác, lưu hậu tố mới. Anh duyệt thì gửi qua Outlook (tab Outlook).\",\"Takes the newest file as the base (you may have edited it), patches only the named slides, runs a diff to be sure nothing else changed and saves a new suffix. Once you approve it goes out via Outlook (Outlook tab).\"),\n   sh:L(\"Lấy file mới nhất làm nền, chỉ vá slide anh nêu, diff để chắc không đụng slide khác; duyệt thì gửi qua Outlook.\",\"Takes the newest file as the base, patches only the named slides, diffs to be sure; once approved it goes out via Outlook.\")},\n  {id:\"sabt\",g:\"gx\",k:\"lun\",i:\"k-stop\",c:0,y:430,w:300,h:50,t:L(\"DỪNG & BÁO ANH\",\"STOP & TELL YOU\"),s:L(\"\",\"\"),gio:L(\"\",\"\"),\n   ct:L(\"Nguồn mâu thuẫn hoặc thiếu thì dừng, nói thẳng chỗ nào và hỏi anh; tuyệt đối không bịa số hay tự suy diễn nhận định.\",\"If sources conflict or are missing it stops, says exactly where and asks you; it never invents numbers or conclusions.\"),\n   sh:L(\"Nguồn mâu thuẫn hoặc thiếu thì dừng, nói rõ chỗ nào và hỏi anh; không bịa số, không tự suy diễn.\",\"Conflicting or missing sources stop the work; it says where and asks you; no invented numbers or conclusions.\")}\n ],\n steps:[[\"s1\",\"s2\"],[\"s3\"],[\"s4\"],[\"s5\"],[\"s6\"],[\"s7\"],[\"s8\"]],\n stepTxt:{0:L(\"Hai việc chạy SONG SONG ngay khi nhận yêu cầu: hỏi anh mục tiêu (kèm file nguồn chính) và Claude đọc nguồn chỉ-đọc.\",\"Two jobs run IN PARALLEL as soon as the request arrives: asking you the goal (and the main source file) and Claude reading the sources read-only.\")},\n abortOn:[\"s2\"],\n pos:function(n){if(n.id===\"sabt\")return [40+130-150+0,n.y];return [40+n.c*310,n.y];},\n W:260,H:96,\n edges:[{f:\"s1\",t:\"s3\",m:\"rl\",c:\"g1\"},{f:\"s2\",t:\"s3\",m:\"rl\",c:\"g1\"},{f:\"s3\",t:\"s4\",m:\"rl\",c:\"g1\"},{f:\"s4\",t:\"s5\",m:\"rl\",c:\"g1\"},{f:\"s5\",t:\"s6\",m:\"rl\",c:\"g5\"},\n        {f:\"s6\",t:\"s7\",m:\"tb\",c:\"g5\"},{f:\"s7\",t:\"s8\",m:\"lr\",c:\"g5\"},{f:\"s2\",t:\"sabt\",m:\"tb\",c:\"gx\",dash:1},{f:\"s8\",t:\"s8\",m:\"vong\",c:\"g5\"}],\n groups:[\n  {ids:[\"s1\",\"s2\"],g:\"g1\",t:L(\"01 · KHỞI ĐỘNG SONG SONG\",\"01 · PARALLEL START\")},\n  {ids:[\"s3\",\"s4\"],g:\"g1\",t:L(\"02 · CHỐT NỘI DUNG BẰNG TEXT\",\"02 · SETTLE THE CONTENT IN TEXT\")},\n  {ids:[\"s5\",\"s6\",\"s7\",\"s8\"],g:\"g5\",at:\"s5\",t:L(\"03 · DỰNG, SOÁT & VÁ\",\"03 · BUILD, CHECK & PATCH\")}\n ],\n labels:[\n  {neo:\"s1\",dx:0,dy:125,giua:1,g:\"g1\",t:L(\"⇅ 2 việc chạy SONG SONG\",\"⇅ 2 jobs run IN PARALLEL\")},\n  {neo:\"s8\",dx:52,dy:-22,anchor:\"end\",g:\"g5\",t:L(\"↻ lặp tới khi anh duyệt\",\"↻ repeat until you approve\")},\n  {neo:\"sabt\",dx:314,dy:30,anchor:\"start\",g:\"gx\",t:L(\"nguồn mâu thuẫn · thiếu số liệu\",\"conflicting or missing sources\")}\n ]\n};\nvar SHORT_NEW={\n e1:L(\"Cuối luồng 7h tự gửi mail báo cáo cho chị Nhan và chị Nhung, mỗi người tối đa 1 mail/ngày.\",\"The 7am run ends by mailing the report to chị Nhan and chị Nhung, at most one mail each per day.\"),\n e2:L(\"Anh dặn Claude qua remote control: gửi lại báo cáo hoặc một mail ad hoc; Claude chạy ngay trên PC công ty.\",\"You tell Claude by remote control: resend the report or send an ad hoc mail; Claude runs on the work PC.\"),\n soan:L(\"Số liệu lượt 7h hoặc theo lời anh dặn; văn phong theo người nhận, ngắn, mở «Dear chị…», kết «Trân trọng!».\",\"Figures from the 7am run or as you instruct; tone follows the reader, short, opens «Dear chị…», closes «Trân trọng!».\"),\n dung:L(\"Tạo thư trong daicd\\\\Drafts, Outlook tự chèn chữ ký mặc định, nội dung Times New Roman 12 đặt trên chữ ký.\",\"Creates the item in daicd\\\\Drafts, Outlook inserts the default signature, Times New Roman 12 text sits above it.\"),\n gui:L(\"Mail định kỳ đã duyệt mẫu: reply vào đúng luồng «Luồng báo cáo dashboard hằng ngày» của từng chị rồi gửi.\",\"Approved recurring mail: reply inside each person's thread «Luồng báo cáo dashboard hằng ngày» and send.\"),\n nhap:L(\"Mail ad hoc, mẫu mới hoặc người mới: chỉ lưu nháp và chụp ảnh, anh bảo «gửi đi» mới gửi.\",\"Ad hoc, new template or new recipient: saved as a draft with a screenshot, sent only when you say «send it».\"),\n kiem:L(\"Thư phải nằm ở Sent Items, Outbox = 0, đúng người, đúng file; kiểm xong mới báo anh «đã gửi».\",\"The mail must be in Sent Items, Outbox = 0, right people, right file; only then does it say «sent».\"),\n nhan:L(\"Chị Nhan nhận bản cấp trên, chị Nhung nhận bản đồng nghiệp; mail ad hoc tới đúng người anh chỉ định.\",\"Chị Nhan gets the senior version, chị Nhung the colleague one; an ad hoc mail goes only to whom you name.\"),\n oabt:L(\"Sai font, thiếu chữ ký, sai người nhận hoặc không bám được Outlook thì dừng và báo anh, không gửi trần.\",\"Wrong font, missing signature, wrong recipient or no Outlook binding: stop and tell you, never send bare.\"),\n s1:L(\"Hỏi anh: thuyết phục điều gì, người xem là ai, dài bao nhiêu slide, câu sếp chắc chắn sẽ hỏi.\",\"Asks: what to persuade, who watches, how many slides, and the question the boss will surely ask.\"),\n s2:L(\"Đọc nguồn ở chế độ chỉ đọc; mâu thuẫn thì báo ngay, thiếu thì ghi «Chưa có thông tin», không viết bừa.\",\"Reads sources read-only; conflicts are reported at once, gaps marked «No information yet», nothing invented.\"),\n s3:L(\"Dựng mạch câu hỏi sếp đi qua: cần gì → cái cũ không đạt → cái mới đạt → duy trì → quy mô → lộ trình → kiến nghị.\",\"Builds the boss's chain of questions: need → old fails → new passes → sustain → scale → roadmap → recommendation.\"),\n s4:L(\"Viết từng slide bằng text, đánh dấu ⚠ chỗ cần xác nhận; anh nói «chốt» thì mới dựng file.\",\"Writes each slide as text with ⚠ for open points; the file is built only after you say «approved».\"),\n s5:L(\"Dựng .pptx 16:9, phông Bahnschrift + Segoe UI, bố cục tự nghĩ; mỗi lần xuất là file mới (_v2, _v3…).\",\"Builds a 16:9 .pptx, Bahnschrift + Segoe UI, designed layouts; every export is a new file (_v2, _v3…).\"),\n s6:L(\"Xuất ảnh từng trang, soát chữ tràn, nhãn đè, khoảng trống; sửa tới khi sạch mới đưa anh.\",\"Renders each page, checks overflow, colliding labels, gaps; fixes until clean before showing you.\"),\n s7:L(\"Anh xem và gom góp ý A–Z một lượt cho đỡ dựng lại nhiều lần.\",\"You review and gather feedback A–Z in one pass to avoid , time, work, Google Sheet task (may be empty), Dashboard task, status + %.\"),\n d2:L(\"Anh lưu và ĐÓNG file, rồi nhắn «đọc file nhập hôm nay»; từ đây Claude lo hết, không cần duyệt.\",\"Save and CLOSE the file, then say 'read today's input file'; Claude takes it from here.\"),\n d3:L(\"Kiểm ngày, giờ, % và tên task; dòng có !! thì dừng và hỏi anh, chưa ghi gì.\",\"Checks date, time, % and task names; a row marked !! stops and asks you, nothing is written.\"),\n d4:L(\"Dựng spec: Claude chỉ điền nhóm việc, đầu mối, kết quả; không tự đổi task, giờ, %.\",\"Builds the spec: Claude only fills group, counterpart, result; never tasks, times or %.\"),\n d5:L(\"Sao lưu rồi ghi các dòng giờ làm vào Excel nhật ký, tính lại thống kê theo 11 Task lớn.\",\"Backs up, writes the time rows into the diary Excel and recalculates the 11-task statistics.\"),\n d6:L(\"Dựng lại dashboard, đẩy lên GitHub; Cloudflare tự build ngầm (≈ 1 phút), luồng không đứng chờ.\",\"Rebuilds the dashboard and pushes it; Cloudflare builds in the background (≈ 1 min), no waiting.\"),\n d7:L(\"Chụp tab Sheet về Excel trung gian, tìm dòng PIC Daicd, đặt ô ngày + trạng thái + %.\",\"Snapshots the Sheet tab into an intermediate Excel, finds the PIC Daicd row, sets day + status + %.\"),\n d8:L(\"Đẩy các ô lên Google Sheet, không ghi đè ô có chữ khác; mạng chập chờn thì tự thử lại.\",\"Pushes the cells to Google Sheet without overwriting other text; retries on a flaky network.\"),\n d9:L(\"Đọc lại từng ô vừa ghi và so với mong đợi; lệch ô nào là báo LECH và dừng (mã 4).\",\"Reads every written cell back and compares; any mismatch is reported as LECH and stops (code 4).\"),\n d10:L(\"Ép MỌI ô dòng PIC Daicd: wrap 100%, căn giữa ngang + dọc, Times New Roman 12.\",\"Forces EVERY PIC Daicd cell: 100% wrap, centred both ways, Times New Roman 12.\"),\n d11:L(\"Duyệt lại từng ô; đạt 100% mới qua, còn lệch thì báo số ô lệch cho anh.\",\"Re-checks every cell; only 100% passes, any leftover is reported with its count.\")     else if(g.id==="daily"){if(w.__sd)w.__sd.doi(g.views[vi].id);}
  }catch(e){}
  setTimeout(function(){try{w.dispatchEvent(new Event("resize"));}catch(e){}},60);
}
function chuanBi(gi){
  var g=G[gi],f=fr[g.id],w=f.contentWindow,d=f.contentDocument;
  try{
    var s=d.createElement("style");s.textContent=g.css;d.head.appendChild(s);
    if(g.id==="van"){d.documentElement.setAttribute("data-theme","dark");if(w.SDFULL)w.SDFULL(true);}
    d.addEventListener("keydown",function(e){if(e.key==="["){e.preventDefault();dich(-1);}else if(e.key==="]"){e.preventDefault();dich(1);}});
  }catch(e){}
  san[g.id]=true;
  if(gi===st.g)chonCheDo(st.g,st.v);
  dong();
}
function taoIframe(gi){
  var g=G[gi];if(fr[g.id])return;
  var f=document.createElement("iframe");f.title=g.t;f.setAttribute("allow","fullscreen");
  f.addEventListener("load",function(){chuanBi(gi);});
  fr[g.id]=f;el.stage.appendChild(f);
  f.srcdoc=DOCS[g.id];
}
function veTab(){
  el.nhom.innerHTML="";
  G.forEach(function(g,gi){
    var b=document.createElement("button");b.className="gt";b.style.setProperty("--m",g.m);b.setAttribute("role","tab");b.setAttribute("aria-selected",gi===st.g);
    b.innerHTML='<span class="so">'+(gi+1)+'</span><span style="min-width:0"><b>'+g.t+'</b><small>'+g.s+'</small></span><span class="dem">'+g.views.length+'</span>';
    b.onclick=function(){chon(gi,gi===st.g?st.v:0);};
    el.nhom.appendChild(b);
  });
  var g=G[st.g];el.vt.innerHTML="";
  g.views.forEach(function(v,vi){
    var b=document.createElement("button");b.style.setProperty("--m",g.m);b.setAttribute("role","tab");b.setAttribute("aria-selected",vi===st.v);b.textContent=v.t;
    b.onclick=function(){chon(st.g,vi);};el.vt.appendChild(b);
  });
  el.mt.innerHTML=g.views[st.v].d;
  var idx=FLAT.findIndex(function(p){return p[0]===st.g&&p[1]===st.v;});
  el.dem2.textContent=(idx+1)+" / "+FLAT.length;
}
function chon(gi,vi){
  st.g=gi;st.v=vi;
  var gr=laGraph(gi,vi);
  if(gr)taoGraph();else taoIframe(gi);
  G.forEach(function(g,i){var f=fr[g.id];if(f)f.classList.toggle("on",i===gi&&!gr);});
  if(fr.gr)fr.gr.classList.toggle("on",gr);
  veTab();
  if(san[G[gi].id])chonCheDo(gi,vi);
  dong();
  var idx=FLAT.findIndex(function(p){return p[0]===gi&&p[1]===vi;});
  try{history.replaceState(null,"","#"+(idx+1));}catch(e){}
  var f=fr[G[gi].id];if(f&&san[G[gi].id])setTimeout(function(){try{f.contentWindow.dispatchEvent(new Event("resize"));}catch(e){}},80);
}
/* ---- cụm điều khiển: đọc/nhấn nút của trang con đang hiện ---- */
var CTRL={
 van:{lang:".ngon button[data-ngon]",key:"data-ngon",pause:"#aiPhat",gio:"#aiGio",chiAI:true},
 bot:{lang:"#ngon button",key:"data-n",pause:"#bPause",gio:"#clock"},
 daily:{lang:"#ngon button",key:"data-n",pause:"#bPause",gio:"#gio"}
};
function cfg(){var g=G[st.g],f=fr[g.id],c=CTRL[g.id];if(laGraph(st.g,st.v))return null;if(!f||!san[g.id])return null;
  var d;try{d=f.contentDocument;}catch(e){return null;}
  return {g:g,d:d,c:c,hien:!(c.chiAI&&g.views[st.v].id!=="ai")};}
function dong(){
  var k=cfg(),box=document.getElementById("ctl2"),tg=document.getElementById("hTong"),tx="";
  if(k&&k.g.id==="bot"){var t=k.d.querySelector(".tabs .tong");if(t)tx=t.innerHTML;}
  if(tg.innerHTML!==tx)tg.innerHTML=tx;
  if(k&&k.g.id==="van"&&k.g.views[st.v].id==="ai"){var ph=k.d.querySelector(".ai-phu"),mt=document.getElementById("mt");
    if(ph&&mt.textContent!==ph.textContent)mt.textContent=ph.textContent;}
  if(!k||!k.hien){box.classList.add("an");return;}
  box.classList.remove("an");box.style.setProperty("--m",k.g.m);
  var bs=k.d.querySelectorAll(k.c.lang);
  [].forEach.call(document.querySelectorAll("#hLang button"),function(b){
    var on=false;[].forEach.call(bs,function(x){if(x.getAttribute(k.c.key)===b.getAttribute("data-n")&&(x.classList.contains("on")||x.getAttribute("aria-pressed")==="true"))on=true;});
    b.classList.toggle("on",on);});
  var p=k.d.querySelector(k.c.pause),gi=k.d.querySelector(k.c.gio);
  if(p)document.getElementById("hPause").textContent=p.textContent;
  if(gi)document.getElementById("hGio").textContent=gi.textContent;
}
document.getElementById("hLang").addEventListener("click",function(e){
  var n=e.target.getAttribute&&e.target.getAttribute("data-n");if(!n)return;var k=cfg();if(!k)return;
  [].forEach.call(k.d.querySelectorAll(k.c.lang),function(x){if(x.getAttribute(k.c.key)===n)x.click();});dong();
});
document.getElementById("hPause").addEventListener("click",function(){var k=cfg();if(!k)return;var p=k.d.querySelector(k.c.pause);if(p)p.click();setTimeout(dong,30);});
setInterval(dong,250);

function dich(k){
  var idx=FLAT.findIndex(function(p){return p[0]===st.g&&p[1]===st.v;});
  idx=(idx+k+FLAT.length)%FLAT.length;chon(FLAT[idx][0],FLAT[idx][1]);
}
function full(){
  var a=document.getElementById("app");
  if(document.fullscreenElement){document.exitFullscreen();}
  else{(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}
}
document.getElementById("bTruoc").onclick=function(){dich(-1);};
document.getElementById("bSau").onclick=function(){dich(1);};
document.getElementById("bFull").onclick=full;
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="["){dich(-1);}else if(e.key==="]"){dich(1);}
  else if(e.key==="f"||e.key==="F"){full();}
});
window.addEventListener("message",function(e){var d=e.data;if(!d||!d.f2drWF)return;if(d.f2drWF==="full")full();else if(d.f2drWF==="thoat"&&document.fullscreenElement)document.exitFullscreen();});
window.__hub={chon:chon,st:st,fr:fr,G:G,FLAT:FLAT,dich:dich};
var h=parseInt((location.hash||"").replace("#",""),10);
if(h>=1&&h<=FLAT.length)chon(FLAT[h-1][0],FLAT[h-1][1]);else chon(0,0);
})();
</script>
</body>
</html>
