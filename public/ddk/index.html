<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>18/11 - Ngày hội Đại đoàn kết toàn dân tộc</title>
<meta property="og:type" content="website">
<meta property="og:title" content="18/11 - Ngày hội Đại đoàn kết toàn dân tộc">
<meta property="og:description" content="Trung tâm Vận hành Khai thác">
<meta property="og:image" content="https://f2dr-dashboard-pages.pages.dev/ddk/ap-phich.png">
<meta name="robots" content="noindex">
<style>
html,body{margin:0;height:100%;background:#7a0b0b;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-select:none}
:fullscreen img{cursor:zoom-out}
.bar{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;opacity:.0;transition:opacity .25s}
body:hover .bar,.bar:focus-within{opacity:1}
@media (hover:none){.bar{opacity:.85}}
.bar button,.bar a{font:600 13px/1 system-ui,Segoe UI,Arial,sans-serif;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;text-decoration:none;cursor:pointer;backdrop-filter:blur(4px)}
.bar button:hover,.bar a:hover{background:rgba(0,0,0,.75)}
:fullscreen .bar{opacity:0}
:fullscreen body:hover .bar{opacity:0}
</style>
</head>
<body>
<img id="anh" src="ap-phich.png" alt="Áp phích 18/11 - Ngày hội Đại đoàn kết toàn dân tộc - Trung tâm Vận hành Khai thác" title="Nhấp đúp hoặc bấm F để xem toàn màn hình">
<div class="bar">
  <button id="fs" type="button" title="Toàn màn hình (F)">Toàn màn hình · F</button>
  <a href="ap-phich.png" target="_blank" rel="noopener" title="Mở ảnh gốc">Ảnh gốc</a>
</div>
<script>
(function(){
  var el=document.documentElement, btn=document.getElementById('fs'), img=document.getElementById('anh');
  var can=!!(el.requestFullscreen||el.webkitRequestFullscreen);
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  function toggle(){
    if(!can) return;
    if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
  }
  if(!can) btn.style.display='none';
  btn.addEventListener('click',toggle);
  img.addEventListener('dblclick',toggle);
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='f'||e.key==='F'){e.preventDefault();toggle();}
  });
})();
</script>
</body>
</html>
